<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahmet Tekeli - VIP Kasa</title>
    
    <link rel="apple-touch-icon" href="ikon.png">
    <link rel="icon" type="image/png" href="ikon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kasa">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .p-btn { transition: all 0.2s; border: 2px solid transparent; }
        .active-p { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-50 p-2 text-slate-900">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-5 min-h-[95vh] flex flex-col border border-slate-100">
        
        <div class="text-center mb-3">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter uppercase">AHMET TEKELİ</h1>
            <p class="text-[9px] font-bold text-blue-600 tracking-widest uppercase italic">KASA TAKİP</p>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-3">
            <button onclick="pSec('Sahip')" id="btnSahip" class="p-btn active-p bg-slate-50 p-2 rounded-xl text-[9px] font-bold uppercase text-center leading-tight">AHMET<br>TEKELİ</button>
            <button onclick="pSec('Ercan')" id="btnErcan" class="p-btn bg-slate-50 p-2 rounded-xl text-[9px] font-bold uppercase text-center leading-tight">ERCAN<br>DOĞRU</button>
            <button onclick="pSec('Efe')" id="btnEfe" class="p-btn bg-slate-50 p-2 rounded-xl text-[9px] font-bold uppercase text-center leading-tight">EFE<br>KARA</button>
            <button onclick="pSec('Gider')" id="btnGider" class="p-btn bg-red-50 text-red-600 p-2 rounded-xl text-[9px] font-bold uppercase">GİDER</button>
        </div>
        
        <div class="grid grid-cols-3 gap-2 mb-3">
            <button onclick="hSec('Saç', 500)" class="bg-white border p-3 rounded-xl shadow-sm text-[10px] font-bold uppercase active:bg-gray-100">Saç 500</button>
            <button onclick="hSec('Sakal', 250)" class="bg-white border p-3 rounded-xl shadow-sm text-[10px] font-bold uppercase active:bg-gray-100">Sakal 250</button>
            <button onclick="hSec('Saç-Sakal', 700)" class="bg-blue-50 border border-blue-100 p-3 rounded-xl shadow-sm text-[10px] font-black text-blue-700 uppercase active:bg-blue-100">Full 700</button>
            <button onclick="hSec('Çocuk', 450)" class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl shadow-sm text-[10px] font-black text-emerald-700 uppercase active:bg-emerald-100">Çocuk 450</button>
            <button onclick="hSec('Yıkama', 100)" class="bg-white border p-3 rounded-xl shadow-sm text-[10px] font-bold uppercase active:bg-gray-100">Yıkama 100</button>
            <button onclick="hSec('Boya', 1000)" class="bg-slate-800 text-white p-3 rounded-xl shadow-sm text-[10px] font-bold uppercase active:bg-black">Boya 1000</button>
        </div>

        <div class="bg-slate-100 p-3 rounded-2xl mb-3 shadow-inner border border-slate-200">
            <div class="flex gap-1 mb-2">
                <input type="text" id="h" placeholder="İşlem" class="w-1/3 p-3 rounded-xl border-none text-[11px] outline-none shadow-sm">
                <input type="number" id="t" placeholder="₺" class="w-1/4 p-3 rounded-xl border-none text-sm font-black outline-none shadow-sm">
                <select id="y" class="w-1/3 p-3 rounded-xl bg-white text-[9px] font-bold outline-none border border-gray-200">
                    <option value="Nakit">NAKİT</option>
                    <option value="Kart">KART</option>
                    <option value="Iban">IBAN</option>
                </select>
            </div>
            <button onclick="kaydet()" id="kayitBtn" class="w-full bg-slate-800 text-white p-3 rounded-xl font-bold uppercase text-[10px] tracking-widest active:bg-black">SİSTEME KAYDET</button>
        </div>

        <div class="space-y-2 mb-3">
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-orange-50 p-3 rounded-2xl border border-orange-200 shadow-sm text-center">
                    <p class="text-[9px] font-bold text-orange-600 uppercase mb-1">Ercan (%50)</p>
                    <p class="text-xs font-black text-orange-800">PAY: <span id="pErcan">0 ₺</span></p>
                </div>
                <div class="bg-purple-50 p-3 rounded-2xl border border-purple-200 shadow-sm text-center">
                    <p class="text-[9px] font-bold text-purple-600 uppercase mb-1">Efe (%30)</p>
                    <p class="text-xs font-black text-purple-800">PAY: <span id="pEfe">0 ₺</span></p>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 text-white p-4 rounded-[2rem] shadow-xl mb-3">
            <div class="flex justify-between items-center mb-2">
                <div><p class="text-[9px] font-bold text-slate-400 uppercase">Bugün Toplam</p><p id="cToplam" class="text-xl font-black">0 ₺</p></div>
                <div class="text-right"><p class="text-[9px] font-bold text-red-400 uppercase">Gider</p><p id="gToplam" class="text-xl font-black text-red-400">0 ₺</p></div>
            </div>
            <div class="bg-white/10 p-3 rounded-xl flex justify-between items-center border border-white/5">
                <p class="text-[9px] font-bold text-slate-400 uppercase italic">Dükkan Bugün Net</p>
                <p id="netKalan" class="text-lg font-black text-emerald-400">0 ₺</p>
            </div>
        </div>

        <button onclick="kasaSifirla()" class="w-full py-4 bg-emerald-600 text-white text-[11px] font-black rounded-2xl uppercase mb-3 shadow-lg active:scale-95 transition-all">
            HESABI GÖR VE GÜNÜ KAPAT
        </button>

        <div class="bg-blue-600 text-white p-4 rounded-[2.5rem] shadow-xl text-center">
            <p class="text-[9px] font-black uppercase opacity-80 tracking-widest italic mb-1">BU AY DÜKKANA KALAN (NET KÂR)</p>
            <h2 id="aylikCiro" class="text-3xl font-black tracking-tighter">0 ₺</h2>
            <p class="text-[8px] opacity-60 mt-1 uppercase">Kapatılan günlerin toplam net kârıdır</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDpT9QsG7V23KtKZMVXmIfeX_Mg-eAeBZM",
            databaseURL: "https://berberkasa-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "berberkasa",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let p = 'Sahip';
        let bugunkuNetKar = 0; // Geçici hesaplama için

        function pSec(sec) {
            p = sec;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
            document.getElementById('btn' + sec).classList.add('active-p');
        }

        function hSec(ad, fiyat) {
            document.getElementById('h').value = ad;
            document.getElementById('t').value = fiyat;
        }

        function kaydet() {
            const h = document.getElementById('h').value;
            const t = parseFloat(document.getElementById('t').value);
            const y = document.getElementById('y').value;
            if(!h || isNaN(t)) return;

            const btn = document.getElementById('kayitBtn');
            btn.disabled = true;

            // Sadece günlük kasa (kasa/) içine ekle, aylıkNet'e dokunma!
            db.ref('kasa/').push({ h, t, y, p, tarih: Date.now() });

            setTimeout(() => {
                document.getElementById('h').value = '';
                document.getElementById('t').value = '';
                btn.disabled = false;
            }, 500);
        }

        db.ref('kasa/').on('value', (snapshot) => {
            const veriler = snapshot.val();
            let nT=0, kT=0, iT=0, gTop=0;
            let eC=0, fC=0;

            if (veriler) {
                Object.values(veriler).forEach(i => {
                    const t = parseFloat(i.t);
                    if (i.p === 'Gider') { gTop += t; } 
                    else {
                        if (i.y === 'Nakit') nT += t;
                        if (i.y === 'Kart') kT += t;
                        if (i.y === 'Iban') iT += t;

                        if(i.p==='Ercan') eC += t;
                        else if(i.p==='Efe') fC += t;
                    }
                });
            }

            const ePay = eC * 0.50; 
            const fPay = fC * 0.30; 
            const bugunToplam = nT + kT + iT;
            bugunkuNetKar = Math.floor(bugunToplam - (ePay + fPay + gTop));

            document.getElementById('cToplam').innerText = bugunToplam + " ₺";
            document.getElementById('gToplam').innerText = gTop + " ₺";
            document.getElementById('pErcan').innerText = Math.floor(ePay) + " ₺";
            document.getElementById('pEfe').innerText = Math.floor(fPay) + " ₺";
            document.getElementById('netKalan').innerText = bugunkuNetKar + " ₺";
        });

        // Aylık kârı sadece oku
        const ayID = new Date().getFullYear() + "-" + (new Date().getMonth() + 1);
        db.ref('aylikNet/' + ayID).on('value', (snapshot) => {
            document.getElementById('aylikCiro').innerText = Math.floor(snapshot.val() || 0).toLocaleString('tr-TR') + " ₺";
        });

        function kasaSifirla() {
            if(confirm("Günü kapatıyorsun Ahmet abi? Bugünkü Net Kâr (" + bugunkuNetKar + " ₺) aylık toplama eklenecek.")) {
                const ayID = new Date().getFullYear() + "-" + (new Date().getMonth() + 1);
                
                // ASIL HESAP BURADA: Günü kapatınca aylık toplama tek seferde ekle
                db.ref('aylikNet/' + ayID).transaction(curr => (curr || 0) + bugunkuNetKar);
                
                // Günlük tabloyu temizle
                db.ref('kasa/').remove();
                alert("Gün başarıyla kapatıldı ve aylık kâra eklendi.");
            }
        }
    </script>
</body>
</html>
