<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahmet Tekeli - VIP Kasa</title>
    
    <link rel="apple-touch-icon" href="ikon.png">
    <link rel="icon" type="image/png" href="ikon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AT Kasa">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .p-btn { transition: all 0.2s; border: 2px solid transparent; }
        .active-p { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; }
        #qrcode img { margin: 0 auto; border: 8px solid white; border-radius: 12px; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-50 p-2 text-slate-900">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-5 min-h-[95vh] flex flex-col border border-slate-100">
        
        <div class="text-center mb-3">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter uppercase">AHMET TEKELİ</h1>
            <p class="text-[9px] font-bold text-blue-600 tracking-widest uppercase italic">KASA TAKİP</p>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-3">
            <button onclick="pSec('Sahip')" id="btnSahip" class="p-btn active-p bg-slate-50 p-2 rounded-xl text-[9px] font-bold uppercase">Dükkan</button>
            <button onclick="pSec('Ercan')" id="btnErcan" class="p-btn bg-slate-50 p-2 rounded-xl text-[9px] font-bold uppercase">Ercan</button>
            <button onclick="pSec('Efe')" id="btnEfe" class="p-btn bg-slate-50 p-2 rounded-xl text-[9px] font-bold uppercase">Efe</button>
            <button onclick="pSec('Gider')" id="btnGider" class="p-btn bg-red-50 text-red-600 p-2 rounded-xl text-[9px] font-bold uppercase">GİDER</button>
        </div>
        
        <div class="bg-slate-100 p-3 rounded-2xl mb-3 shadow-inner border border-slate-200">
            <div class="flex gap-1 mb-2">
                <input type="text" id="h" placeholder="İşlem" class="w-1/3 p-3 rounded-xl border-none text-[11px] outline-none shadow-sm">
                <input type="number" id="t" placeholder="₺" class="w-1/4 p-3 rounded-xl border-none text-sm font-black outline-none shadow-sm">
                <select id="y" class="w-1/3 p-3 rounded-xl bg-white text-[9px] font-bold outline-none border border-gray-200">
                    <option value="Nakit">NAKİT</option>
                    <option value="Kart">KART</option>
                    <option value="Iban">IBAN</option>
                </select>
            </div>
            <button onclick="kaydet()" id="kayitBtn" class="w-full bg-slate-800 text-white p-3 rounded-xl font-bold uppercase text-[10px] active:bg-black transition-all">SİSTEME KAYDET</button>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-3 text-center">
            <div class="bg-orange-50 p-2 rounded-2xl border border-orange-200 shadow-sm">
                <p class="text-[9px] font-bold text-orange-600 uppercase">Ercan (%50)</p>
                <p class="text-[8px] font-bold">IBAN: <span id="eI">0₺</span></p>
                <p class="text-xs font-black text-orange-800">PAY: <span id="pErcan">0 ₺</span></p>
            </div>
            <div class="bg-purple-50 p-2 rounded-2xl border border-purple-200 shadow-sm">
                <p class="text-[9px] font-bold text-purple-600 uppercase">Efe (%30)</p>
                <p class="text-[8px] font-bold">IBAN: <span id="fI">0₺</span></p>
                <p class="text-xs font-black text-purple-800">PAY: <span id="pEfe">0 ₺</span></p>
            </div>
        </div>

        <div class="bg-slate-900 text-white p-4 rounded-[2rem] shadow-xl mb-3 text-center">
            <div class="grid grid-cols-3 gap-1 mb-2 text-[8px] font-bold">
                <div class="text-emerald-400">NAK: <span id="nToplam">0₺</span></div>
                <div class="text-blue-400">KAR: <span id="kToplam">0₺</span></div>
                <div class="text-orange-400">IBAN: <span id="iToplam">0₺</span></div>
            </div>
            <p class="text-[9px] text-slate-400 uppercase tracking-widest">Dükkan Net Kâr</p>
            <p id="netKalan" class="text-2xl font-black text-emerald-400">0 ₺</p>
        </div>

        <div class="bg-blue-600 text-white p-3 rounded-[1.5rem] shadow-lg mb-3 text-center">
            <p class="text-[8px] font-black uppercase tracking-widest opacity-80">BU AY TOPLAM CİRO</p>
            <h2 id="aylikCiro" class="text-2xl font-black">0 ₺</h2>
        </div>

        <div class="bg-slate-50 border-2 border-dashed border-slate-200 p-4 rounded-[2rem] text-center mb-3">
            <p class="text-[9px] font-black text-slate-500 uppercase mb-2 tracking-widest italic">Hızlı Ödeme Karekod</p>
            <div id="qrcode" class="mb-2 flex justify-center"></div>
            <p class="text-[11px] font-bold text-slate-800">Emine Tekeli</p>
            <p id="ibanDisplay" class="text-[8px] font-mono text-slate-500 mb-2 truncate px-4">TR95 0013 4000 0160 3155 6000 01</p>
            <button onclick="kopyalaIban()" class="bg-slate-800 text-white text-[8px] px-4 py-2 rounded-full font-bold uppercase active:scale-95">İban Kopyala</button>
        </div>

        <button onclick="kasaSifirla()" class="w-full py-3 text-slate-400 text-[8px] font-bold border-2 border-dashed border-slate-200 rounded-xl uppercase tracking-[0.4em] active:text-red-600">Günü Kapat</button>
    </div>

    <script>
        // --- BURAYI DEĞİŞTİR ABİ ---
        const benimIban = "TR95 0013 4000 0160 3155 6000 01"; // IBAN'ını buraya yaz
        const isimSoyisim = "Emine Tekeli";
        // ---------------------------

        const firebaseConfig = {
            apiKey: "AIzaSyDpT9QsG7V23KtKZMVXmIfeX_Mg-eAeBZM",
            databaseURL: "https://berberkasa-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "berberkasa",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let p = 'Sahip';

        // QR Kod
        new QRCode(document.getElementById("qrcode"), {
            text: `iban:${benimIban}?name=${encodeURIComponent(isimSoyisim)}`,
            width: 100, height: 100, colorDark : "#0f172a", colorLight : "#f8fafc"
        });
        document.getElementById('ibanDisplay').innerText = benimIban;

        function pSec(secilen) {
            p = secilen;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
            document.getElementById('btn' + secilen).classList.add('active-p');
        }

        function kopyalaIban() {
            navigator.clipboard.writeText(benimIban);
            alert("İban Kopyalandı!");
        }

        function kaydet() {
            const h = document.getElementById('h').value;
            const t = parseFloat(document.getElementById('t').value);
            const y = document.getElementById('y').value;
            if(!h || isNaN(t)) return;

            const btn = document.getElementById('kayitBtn');
            btn.disabled = true;

            const ayID = new Date().getFullYear() + "-" + (new Date().getMonth() + 1);

            db.ref('kasa/').push({ h, t, y, p, tarih: Date.now() });
            if(p !== 'Gider') {
                db.ref('aylik/' + ayID).transaction(current => (current || 0) + t);
            }

            setTimeout(() => {
                document.getElementById('h').value = '';
                document.getElementById('t').value = '';
                btn.disabled = false;
            }, 500);
        }

        db.ref('kasa/').on('value', (snapshot) => {
            const veriler = snapshot.val();
            let nT=0, kT=0, iT=0, gTop=0;
            let eT=0, fT=0, eI=0, fI=0;

            if (veriler) {
                Object.values(veriler).forEach(i => {
                    const tutar = parseFloat(i.t);
                    if (i.p === 'Gider') { gTop += tutar; } 
                    else {
                        if (i.y === 'Nakit') nT += tutar; 
                        else if (i.y === 'Kart') kT += tutar;
                        else if (i.y === 'Iban') { iT += tutar; if(i.p==='Ercan') eI+=tutar; if(i.p==='Efe') fI+=tutar; }
                        if (i.p === 'Ercan') eT += tutar;
                        else if (i.p === 'Efe') fT += tutar;
                    }
                });
            }

            const ePay = eT * 0.50; 
            const fPay = fT * 0.30; 
            const bugunCiro = nT + kT + iT;

            document.getElementById('nToplam').innerText = nT + "₺";
            document.getElementById('kToplam').innerText = kT + "₺";
            document.getElementById('iToplam').innerText = iT + "₺";
            document.getElementById('eI').innerText = eI + "₺";
            document.getElementById('fI').innerText = fI + "₺";
            document.getElementById('pErcan').innerText = Math.floor(ePay) + " ₺";
            document.getElementById('pEfe').innerText = Math.floor(fPay) + " ₺";
            document.getElementById('gToplam').innerText = gTop + " ₺";
            document.getElementById('netKalan').innerText = Math.floor(bugunCiro - (ePay + fPay + gTop)) + " ₺";
        });

        const ayID = new Date().getFullYear() + "-" + (new Date().getMonth() + 1);
        db.ref('aylik/' + ayID).on('value', (snapshot) => {
            document.getElementById('aylikCiro').innerText = (snapshot.val() || 0).toLocaleString('tr-TR') + " ₺";
        });

        function kasaSifirla() {
            if(confirm("Günü kapatıyorsun Ahmet abi?")) { db.ref('kasa/').remove(); }
        }
    </script>
</body>
</html>
