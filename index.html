<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profesyonel Salon Yönetimi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center;font-size:22px;font-weight:700}
nav{display:flex;background:#020617;border-top:1px solid #1e293b}
nav button{flex:1;padding:14px;background:none;border:none;color:#94a3b8;font-weight:600}
nav button.active{color:#22c55e;border-bottom:3px solid #22c55e}
.container{padding:15px}
.card{background:#1e293b;border-radius:12px;padding:15px;margin-bottom:15px}
input,select{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;background:#334155;color:#fff}
button.action{background:#22c55e;border:none;padding:10px;border-radius:8px;color:white;font-weight:600;margin-top:10px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.item{background:#334155;border-radius:10px;padding:10px}
.small{font-size:12px;color:#94a3b8}
</style>
</head>
<body>

<header>💈 Profesyonel Salon Yönetim Paneli</header>

<div class="container" id="login"></div>

<nav style="display:none" id="nav">
<button onclick="tab('dashboard')" id="t-dashboard" class="active">Panel</button>
<button onclick="tab('mypanel')" id="t-mypanel">Kendi Panelim</button>
<button onclick="tab('barbers')" id="t-barbers">Berberler</button>
<button onclick="tab('services')" id="t-services">Hizmetler</button>
<button onclick="tab('reports')" id="t-reports">Rapor</button>
</nav>

<div class="container" id="app"></div>

<script>
let state={
users:[
{name:"Ahmet",role:"admin"},
{name:"Mehmet",role:"barber",percent:50},
{name:"Ali",role:"barber",percent:50}
],
services:[
{name:"Saç",price:200},
{name:"Sakal",price:100}
],
logs:[]
}

let currentUser=null

function renderLogin(){
login.innerHTML=`
<div class="card">
<h2>Giriş</h2>
<select id="userSel">
${state.users.map(u=>`<option>${u.name}</option>`).join("")}
</select>
<button class="action" onclick="loginUser()">Giriş Yap</button>
</div>`
}
renderLogin()

function loginUser(){
let name=document.getElementById("userSel").value
currentUser=state.users.find(u=>u.name===name)
login.style.display="none"
nav.style.display="flex"
tab("dashboard")
}

function tab(t){
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"))
document.getElementById("t-"+t).classList.add("active")
if(t==="dashboard") renderDashboard()
if(t==="mypanel") renderMyPanel()
if(t==="barbers") renderBarbers()
if(t==="services") renderServices()
if(t==="reports") renderReports()
}

function renderDashboard(){
let total=state.logs.reduce((a,b)=>a+b.price,0)
let shop=state.logs.reduce((a,b)=>a+b.shopEarn,0)
app.innerHTML=`
<div class="card">
<h2>Genel Durum</h2>
<p>Toplam Ciro: ${total} ₺</p>
<p>Ortak Kasa: ${shop} ₺</p>
</div>

<div class="card">
<h2>İşlem Ekle</h2>
<select id="barberSel">
${state.users.map(u=>`<option>${u.name}</option>`).join("")}
</select>
<select id="serviceSel">
${state.services.map(s=>`<option>${s.name}</option>`).join("")}
</select>
<input type="number" id="priceInp" placeholder="Fiyat (boş=otomatik)">
<button class="action" onclick="addLog()">Kaydet</button>
</div>`
}

function addLog(){
let barberName=barberSel.value
let serviceName=serviceSel.value
let priceInput=priceInp.value
let service=state.services.find(s=>s.name===serviceName)
let barber=state.users.find(u=>u.name===barberName)
let price=priceInput?Number(priceInput):service.price

let barberEarn=0, shopEarn=price
if(barber.role==="barber"){
barberEarn=price*(barber.percent/100)
shopEarn=price-barberEarn
}

state.logs.push({barber:barberName,service:serviceName,price,barberEarn,shopEarn})
tab("dashboard")
}

function renderMyPanel(){
let myLogs=state.logs.filter(l=>l.barber===currentUser.name)
let myEarn=myLogs.reduce((a,b)=>a+b.barberEarn,0)
app.innerHTML=`
<div class="card">
<h2>${currentUser.name} Paneli</h2>
<p>Toplam İş: ${myLogs.length}</p>
<p>Kazancın: ${myEarn.toFixed(2)} ₺</p>
</div>

<div class="card">
<h2>Yaptığım İşler</h2>
${myLogs.map(l=>`
<div class="item">
${l.service} - ${l.price} ₺
<div class="small">Kazanç: ${l.barberEarn.toFixed(2)} ₺</div>
</div>`).join("")}
</div>`
}

function renderBarbers(){
app.innerHTML=`
<div class="card">
<h2>Berberler</h2>
<div class="grid">
${state.users.map((u,i)=>`
<div class="item">
<b>${u.name}</b><br>
${u.role==="barber"?`
Yüzde: <input type="number" value="${u.percent}" onchange="state.users[${i}].percent=Number(this.value)">
<button onclick="delBarber(${i})">Sil</button>
`:`Admin`}
</div>`).join("")}
</div>
</div>

<div class="card">
<h2>Berber Ekle</h2>
<input id="newBarber" placeholder="İsim">
<input id="newPercent" type="number" placeholder="Yüzde">
<button class="action" onclick="addBarber()">Ekle</button>
</div>`
}

function addBarber(){
state.users.push({name:newBarber.value,role:"barber",percent:Number(newPercent.value)})
renderBarbers()
}

function delBarber(i){
if(state.users[i].role!=="admin"){
state.users.splice(i,1)
renderBarbers()
}
}

function renderServices(){
app.innerHTML=`
<div class="card">
<h2>Hizmetler</h2>
${state.services.map((s,i)=>`
<div class="item">
<input value="${s.name}" onchange="state.services[${i}].name=this.value">
<input type="number" value="${s.price}" onchange="state.services[${i}].price=Number(this.value)">
<button onclick="delService(${i})">Sil</button>
</div>`).join("")}
</div>

<div class="card">
<h2>Hizmet Ekle</h2>
<input id="newService" placeholder="Hizmet adı">
<input id="newPrice" type="number" placeholder="Fiyat">
<button class="action" onclick="addService()">Ekle</button>
</div>`
}

function addService(){
state.services.push({name:newService.value,price:Number(newPrice.value)})
renderServices()
}

function delService(i){
state.services.splice(i,1)
renderServices()
}

function renderReports(){
let html=`<div class="card"><h2>Berber Kazanç Raporu</h2>`
state.users.forEach(u=>{
let earn=state.logs.filter(l=>l.barber===u.name)
.reduce((a,b)=>a+b.barberEarn,0)
html+=`<p>${u.name}: ${earn.toFixed(2)} ₺</p>`
})
html+=`</div>`
app.innerHTML=html
}
</script>
</body>
</html>
