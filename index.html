<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahmet Tekeli VIP - V21 Raporlu</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .p-btn { transition: all 0.2s; border: 2px solid transparent; background-color: #f8fafc; color: #64748b; }
        .active-p { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; font-weight: 900 !important; }
        .rapor-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; padding: 20px; }
    </style>
</head>
<body class="bg-slate-50 p-2 text-slate-900 text-[10px]">

    <div id="raporModal" class="rapor-modal flex items-center justify-center">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-black text-lg uppercase tracking-tighter">AYLIK RAPOR</h3>
                <button onclick="document.getElementById('raporModal').style.display='none'" class="text-red-500 font-bold">KAPAT</button>
            </div>
            <div id="raporIcerik" class="space-y-4">
                </div>
            <button onclick="window.print()" class="w-full mt-4 bg-slate-900 text-white py-3 rounded-xl font-bold uppercase">Yazıcıya Gönder / PDF</button>
        </div>
    </div>

    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-4 min-h-[95vh] flex flex-col border border-slate-100">
        
        <div class="text-center mb-2">
            <h1 class="text-xl font-black text-slate-900 tracking-tighter uppercase leading-none italic">AHMET TEKELİ VIP</h1>
            <p id="bugunTarih" class="text-[8px] font-bold text-blue-600 tracking-widest uppercase mt-1 italic"></p>
        </div>

        <div class="grid grid-cols-3 gap-1.5 mb-2">
            <button onclick="pSec('Sahip')" id="btnSahip" class="p-btn active-p p-2 rounded-xl font-black uppercase flex flex-col items-center gap-1">
                <i class="fa-solid fa-scissors text-blue-600 text-sm"></i><span>AHMET</span>
            </button>
            <button onclick="pSec('Ercan')" id="btnErcan" class="p-btn p-2 rounded-xl font-black uppercase text-orange-600 flex flex-col items-center gap-1">
                <i class="fa-solid fa-scissors text-orange-500 text-sm"></i><span>ERCAN (U)</span>
            </button>
            <button onclick="pSec('Efe')" id="btnEfe" class="p-btn p-2 rounded-xl font-black uppercase text-purple-600 flex flex-col items-center gap-1">
                <i class="fa-solid fa-scissors text-purple-500 text-sm"></i><span>EFE (U)</span>
            </button>
            <button onclick="pSec('Turancan')" id="btnTurancan" class="p-btn p-2 rounded-xl font-bold uppercase">TURANCAN</button>
            <button onclick="pSec('Bekir')" id="btnBekir" class="p-btn p-2 rounded-xl font-bold uppercase">BEKİR</button>
            <button onclick="pSec('Gider')" id="btnGider" class="p-btn bg-red-50 text-red-600 p-2 rounded-xl font-bold uppercase italic text-[8px] flex flex-col items-center gap-0.5">
                <i class="fa-solid fa-wallet text-[10px]"></i><span>GİDER</span>
            </button>
        </div>

        <div class="grid grid-cols-3 gap-1.5 mb-2">
            <button onclick="hizliDoldur('Saç', 500)" class="bg-white border py-2 rounded-lg font-bold shadow-sm">SAÇ</button>
            <button onclick="hizliDoldur('Sakal', 250)" class="bg-white border py-2 rounded-lg font-bold shadow-sm">SAKAL</button>
            <button onclick="hizliDoldur('Saç Sakal', 700)" class="bg-blue-50 border-blue-200 border py-2 rounded-lg font-black text-blue-700">SAÇ SAKAL</button>
            <button onclick="hizliDoldur('Haftalık Ödeme', 0)" class="bg-red-600 text-white py-2 rounded-lg font-black uppercase col-span-3 shadow-md">MAAŞ ÖDEMESİ</button>
        </div>

        <div class="bg-slate-100 p-3 rounded-2xl mb-2 shadow-inner border border-slate-200">
            <div class="flex gap-2 mb-2">
                <input type="text" id="h" placeholder="İşlem / Maaş" class="w-1/2 p-2.5 rounded-xl border-none font-bold outline-none">
                <input type="number" id="t" placeholder="₺" class="w-1/2 p-2.5 rounded-xl border-none font-black outline-none text-blue-600 text-base">
            </div>
            <div class="flex gap-2">
                <select id="y" class="w-full p-2.5 rounded-xl bg-white font-black outline-none border border-gray-200 text-[9px]">
                    <option value="Nakit">NAKİT</option><option value="Kart">KART</option><option value="Iban">IBAN</option>
                </select>
                <button onclick="kaydet()" id="kayitBtn" class="bg-slate-800 text-white px-6 rounded-xl font-bold uppercase active:scale-95 text-[9px]">KAYDET</button>
            </div>
        </div>

        <div class="flex-grow bg-slate-50 rounded-xl border border-slate-200 overflow-hidden mb-2 flex flex-col min-h-[60px]">
            <div class="overflow-y-auto max-h-20 flex-grow text-[8px]" id="islemListesi"></div>
        </div>

        <div class="bg-slate-900 text-white p-3 rounded-2xl shadow-xl mb-2 relative">
            <div class="flex justify-between items-center mb-0.5">
                <p class="text-[8px] font-bold text-slate-400 uppercase italic">Günlük Net Kâr</p>
                <p id="netKalan" class="text-xl font-black text-emerald-400">0 ₺</p>
            </div>
            <div class="flex justify-between text-[7px] font-bold text-slate-400 border-t border-white/10 pt-1">
                <span>CİRO: <span id="cToplam" class="text-white">0₺</span></span>
                <span>GİDER: <span id="gToplam" class="text-red-400">0₺</span></span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-2">
            <button onclick="kasaSifirla()" class="py-2.5 bg-emerald-600 text-white text-[9px] font-black rounded-xl uppercase">GÜNÜ KAPAT</button>
            <button onclick="aySifirla()" class="py-2.5 bg-red-600 text-white text-[9px] font-black rounded-xl uppercase">AYI SIFIRLA</button>
        </div>

        <div class="bg-blue-600 text-white p-3 rounded-xl shadow-md border border-blue-400 flex justify-between items-center">
            <div onclick="raporuGoster()" class="cursor-pointer">
                <p class="text-[6px] font-bold uppercase opacity-80 tracking-tighter">AYLIK TOPLAM NET KUMBARA</p>
                <h2 id="aylikCiro" class="text-sm font-black">0 ₺</h2>
            </div>
            <button onclick="raporuGoster()" class="bg-white/20 p-2 rounded-lg hover:bg-white/30">
                <i class="fa-solid fa-file-invoice text-lg"></i>
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDpT9QsG7V23KtKZMVXmIfeX_Mg-eAeBZM", databaseURL: "https://berberkasa-default-rtdb.europe-west1.firebasedatabase.app/", projectId: "berberkasa" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let p = 'Sahip'; let hesaplanmisNet = 0; let guncelVeriler = {};
        const simdi = new Date();
        const ayID = simdi.getFullYear() + "-" + (simdi.getMonth() + 1);
        document.getElementById('bugunTarih').innerText = simdi.toLocaleDateString('tr-TR', { day:'2-digit', month:'long', year:'numeric' });

        function pSec(sec) { p = sec; document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p')); document.getElementById('btn' + sec).classList.add('active-p'); }
        function hizliDoldur(islem, fiyat) { document.getElementById('h').value = islem; document.getElementById('t').value = fiyat; }
        function kaydet() {
            const h = document.getElementById('h').value; const t = parseFloat(document.getElementById('t').value); const y = document.getElementById('y').value;
            if(!h || isNaN(t)) return;
            db.ref('kasa/').push({ h, t, y, p, tarih: new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}) });
            document.getElementById('h').value = ''; document.getElementById('t').value = '';
        }

        db.ref('kasa/').on('value', (snapshot) => {
            const veriler = snapshot.val(); guncelVeriler = veriler;
            const listDiv = document.getElementById('islemListesi');
            listDiv.innerHTML = "";
            let tC=0, gT=0; let m = { Ercan:0, Efe:0, Turancan:0, Bekir:0, Sahip:0 }; let u = { Ercan:0, Efe:0, Sahip:0 };

            if (veriler) {
                Object.values(veriler).reverse().forEach(v => {
                    const t = parseFloat(v.t);
                    listDiv.innerHTML += `<div class="islem-row flex justify-between p-1.5 border-b"><span><b>${v.p}:</b> ${v.h}</span><span class="font-black">${t} ₺</span></div>`;
                    if (v.h.includes('Ödeme')) { gT += t; m[v.p] += t; } 
                    else if (v.p === 'Gider') { gT += t; } 
                    else { tC += t; if(u.hasOwnProperty(v.p)) u[v.p] += t; }
                });
            }
            hesaplanmisNet = Math.floor(tC - (u.Ercan*0.5 + u.Efe*0.3 + gT));
            document.getElementById('aylikCiro').innerText = (hesaplanmisNet > 0 ? hesaplanmisNet : 0) + " ₺"; // Anlık net gösterimi
            document.getElementById('cToplam').innerText = tC + " ₺"; document.getElementById('gToplam').innerText = gT + " ₺";
            document.getElementById('netKalan').innerText = hesaplanmisNet + " ₺";
        });

        // RAPOR FONKSİYONU
        function raporuGoster() {
            if (!guncelVeriler) { alert("Henüz kayıt yok abi!"); return; }
            let r = { 
                Ercan: {is:0, pay:0, maas:0}, 
                Efe: {is:0, pay:0, maas:0}, 
                Sahip: {is:0, pay:0, maas:0},
                Turancan: {maas:0}, 
                Bekir: {maas:0},
                Gider: 0, ciro: 0
            };

            Object.values(guncelVeriler).forEach(v => {
                const t = parseFloat(v.t);
                if (v.h.includes('Ödeme')) { if(r[v.p]) r[v.p].maas += t; }
                else if (v.p === 'Gider') { r.Gider += t; }
                else { 
                    r.ciro += t; 
                    if(r[v.p]) r[v.p].is += t;
                }
            });

            r.Ercan.pay = r.Ercan.is * 0.5;
            r.Efe.pay = r.Efe.is * 0.3;
            const toplamGider = r.Ercan.pay + r.Efe.pay + r.Ercan.maas + r.Efe.maas + r.Turancan.maas + r.Bekir.maas + r.Gider;
            const netKar = r.ciro - toplamGider;

            document.getElementById('raporIcerik').innerHTML = `
                <div class="bg-slate-100 p-3 rounded-xl">
                    <p class="font-bold text-blue-600 text-center mb-2">USTA HAKEDİŞLERİ</p>
                    <div class="grid grid-cols-2 gap-2 text-[9px]">
                        <div class="border-r pr-2"><b>AHMET:</b><br>İş: ${r.Sahip.is}₺</div>
                        <div><b>ERCAN (%50):</b><br>İş: ${r.Ercan.is}₺ | Pay: ${r.Ercan.pay}₺</div>
                        <div class="col-span-2 border-t mt-1 pt-1 text-purple-600 font-bold"><b>EFE (%30):</b><br>İş: ${r.Efe.is}₺ | Pay: ${r.Efe.pay}₺</div>
                    </div>
                </div>
                <div class="bg-red-50 p-3 rounded-xl">
                    <p class="font-bold text-red-600 text-center mb-2">MAAŞ/HAFTALIK ÖDEMELER</p>
                    <div class="grid grid-cols-2 gap-2 text-[9px]">
                        <div>Ercan: ${r.Ercan.maas}₺</div><div>Efe: ${r.Efe.maas}₺</div>
                        <div>Turancan: ${r.Turancan.maas}₺</div><div>Bekir: ${r.Bekir.maas}₺</div>
                    </div>
                </div>
                <div class="bg-slate-900 text-white p-3 rounded-xl text-center">
                    <p class="text-[8px] uppercase">Dükkan Genel Özeti</p>
                    <div class="text-lg font-black text-emerald-400">${Math.floor(netKar)} ₺ NET KÂR</div>
                    <div class="text-[9px] mt-1 opacity-70">Toplam Ciro: ${r.ciro}₺ | Toplam Gider: ${Math.floor(toplamGider)}₺</div>
                </div>
            `;
            document.getElementById('raporModal').style.display = 'flex';
        }

        db.ref('aylikNet/' + ayID).on('value', (snapshot) => { document.getElementById('aylikCiro').innerText = Math.floor(snapshot.val() || 0).toLocaleString('tr-TR') + " ₺"; });
        function kasaSifirla() { if(confirm("Günü kapatıyorsun abi?")) { db.ref('aylikNet/' + ayID).transaction(curr => (curr || 0) + hesaplanmisNet); db.ref('kasa/').remove(); } }
        function aySifirla() { if(confirm("Ayı tamamen sıfırlamak istiyor musun?")) db.ref('aylikNet/' + ayID).set(0); }
    </script>
</body>
</html>
