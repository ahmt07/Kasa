<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berber Kasa Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Berber Kasa Takip</h2>
        
        <div class="space-y-3">
            <input type="text" id="hizmet" placeholder="İşlem (Örn: Saç Kesim)" class="w-full border p-2 rounded">
            <input type="number" id="tutar" placeholder="Tutar (₺)" class="w-full border p-2 rounded">
            <select id="yontem" class="w-full border p-2 rounded">
                <option value="Nakit">Nakit</option>
                <option value="Kart">Kredi Kartı</option>
            </select>
            <button onclick="islemEkle()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 font-bold">EKLE</button>
        </div>

        <hr class="my-6">

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-green-100 p-3 rounded text-center">
                <p class="text-sm text-gray-600">Toplam Nakit</p>
                <p id="toplamNakit" class="text-xl font-bold text-green-700">0 ₺</p>
            </div>
            <div class="bg-blue-100 p-3 rounded text-center">
                <p class="text-sm text-gray-600">Toplam Kart</p>
                <p id="toplamKart" class="text-xl font-bold text-blue-700">0 ₺</p>
            </div>
        </div>

        <h3 class="font-bold mb-2">Bugünkü İşlemler</h3>
        <ul id="islemListesi" class="divide-y divide-gray-200"></ul>
        
        <button onclick="kasaSifirla()" class="mt-6 w-full text-red-500 text-sm">Günü Kapat ve Verileri Sil</button>
    </div>

    <script>
        let islemler = JSON.parse(localStorage.getItem('berber_kasa')) || [];

        function islemEkle() {
            const h = document.getElementById('hizmet').value;
            const t = parseFloat(document.getElementById('tutar').value);
            const y = document.getElementById('yontem').value;

            if(!h || !t) return alert("Eksik bilgi!");

            islemler.push({h, t, y, tarih: new Date().toLocaleTimeString()});
            localStorage.setItem('berber_kasa', JSON.stringify(islemler));
            render();
            
            document.getElementById('hizmet').value = '';
            document.getElementById('tutar').value = '';
        }

        function render() {
            const liste = document.getElementById('islemListesi');
            let nTotal = 0, kTotal = 0;
            liste.innerHTML = '';

            islemler.forEach((islem, index) => {
                if(islem.y === 'Nakit') nTotal += islem.t; else kTotal += islem.t;
                liste.innerHTML += `<li class="py-2 flex justify-between">
                    <span>${islem.h} <small class="text-gray-400">${islem.tarih}</small></span>
                    <span class="font-bold">${islem.t} ₺ (${islem.y})</span>
                </li>`;
            });

            document.getElementById('toplamNakit').innerText = nTotal + " ₺";
            document.getElementById('toplamKart').innerText = kTotal + " ₺";
        }

        function kasaSifirla() {
            if(confirm("Tüm veriler silinecek, emin misin?")) {
                islemler = [];
                localStorage.removeItem('berber_kasa');
                render();
            }
        }
        render();
    </script>
</body>
</html>
