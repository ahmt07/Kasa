<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berber Yönetim Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;font-size:22px;font-weight:700;text-align:center}
nav{display:flex;background:#020617;border-top:1px solid #1e293b}
nav button{flex:1;padding:14px;background:none;border:none;color:#94a3b8;font-weight:600}
nav button.active{color:#22c55e;border-bottom:3px solid #22c55e}
.container{padding:15px}
.card{background:#1e293b;border-radius:12px;padding:15px;margin-bottom:15px}
input,select{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;background:#334155;color:#fff}
button.action{background:#22c55e;border:none;padding:10px;border-radius:8px;color:white;font-weight:600;margin-top:10px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.barber-card{background:#334155;border-radius:12px;padding:12px;text-align:center}
.badge{background:#020617;padding:4px 8px;border-radius:6px;font-size:12px;margin-top:5px;display:inline-block}
h2{margin-top:0}
</style>
</head>
<body>

<header>💈 Berber Yönetim Paneli</header>

<nav>
<button onclick="showTab('dashboard')" id="tab-dashboard" class="active">Panel</button>
<button onclick="showTab('barbers')" id="tab-barbers">Berberler</button>
<button onclick="showTab('services')" id="tab-services">Hizmetler</button>
<button onclick="showTab('reports')" id="tab-reports">Rapor</button>
</nav>

<div class="container" id="app"></div>

<script>
let state={
barbers:[
{name:"Mehmet",percent:50},
{name:"Ali",percent:60},
{name:"Veli",percent:50}
],
services:[
{name:"Saç",price:200},
{name:"Sakal",price:100},
{name:"Saç+Sakal",price:300}
],
logs:[],
expenses:[]
}

function showTab(tab){
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"))
document.getElementById("tab-"+tab).classList.add("active")

if(tab==="dashboard") renderDashboard()
if(tab==="barbers") renderBarbers()
if(tab==="services") renderServices()
if(tab==="reports") renderReports()
}

function renderDashboard(){
let total=state.logs.reduce((a,b)=>a+b.price,0)
let barberPay=state.logs.reduce((a,b)=>a+b.barberEarn,0)
let shop=state.logs.reduce((a,b)=>a+b.shopEarn,0)

app.innerHTML=`
<div class="card">
<h2>Genel Durum</h2>
<p>Toplam Ciro: ${total} ₺</p>
<p>Berberlere Ödenen: ${barberPay} ₺</p>
<p>Ortak Kasa: ${shop} ₺</p>
</div>

<div class="card">
<h2>Hızlı İşlem</h2>
<select id="barberSelect">
${state.barbers.map(b=>`<option>${b.name}</option>`).join("")}
</select>

<select id="serviceSelect">
${state.services.map(s=>`<option>${s.name}</option>`).join("")}
</select>

<input type="number" id="priceInput" placeholder="Fiyat (boş bırak otomatik)">
<button class="action" onclick="addTransaction()">İşlem Kaydet</button>
</div>
`
}

function addTransaction(){
let barberName=document.getElementById("barberSelect").value
let serviceName=document.getElementById("serviceSelect").value
let priceInput=document.getElementById("priceInput").value

let service=state.services.find(s=>s.name===serviceName)
let barber=state.barbers.find(b=>b.name===barberName)

let price=priceInput?Number(priceInput):service.price
let barberEarn=price*(barber.percent/100)
let shopEarn=price-barberEarn

state.logs.push({barber:barberName,price,barberEarn,shopEarn})
renderDashboard()
}

function renderBarbers(){
app.innerHTML=`
<div class="card">
<h2>Berberler</h2>
<div class="grid">
${state.barbers.map((b,i)=>`
<div class="barber-card">
<h3>${b.name}</h3>
<div class="badge">%${b.percent}</div>
<input type="number" value="${b.percent}" onchange="updatePercent(${i},this.value)">
</div>`).join("")}
</div>
</div>

<div class="card">
<h2>Yeni Berber Ekle</h2>
<input id="newBarber" placeholder="Berber adı">
<input id="newPercent" type="number" placeholder="Yüzde %">
<button class="action" onclick="addBarber()">Ekle</button>
</div>
`
}

function updatePercent(i,val){
state.barbers[i].percent=Number(val)
}

function addBarber(){
let name=document.getElementById("newBarber").value
let percent=Number(document.getElementById("newPercent").value)
state.barbers.push({name,percent})
renderBarbers()
}

function renderServices(){
app.innerHTML=`
<div class="card">
<h2>Hizmet Fiyatları</h2>
${state.services.map((s,i)=>`
<div class="card">
<input value="${s.name}" onchange="state.services[${i}].name=this.value">
<input type="number" value="${s.price}" onchange="state.services[${i}].price=Number(this.value)">
</div>`).join("")}
</div>
`
}

function renderReports(){
let html=`<div class="card"><h2>Berber Kazançları</h2>`
state.barbers.forEach(b=>{
let total=state.logs.filter(l=>l.barber===b.name)
.reduce((a,c)=>a+c.barberEarn,0)
html+=`<p>${b.name}: ${total} ₺</p>`
})
html+=`</div>`
app.innerHTML=html
}

renderDashboard()
</script>

</body>
</html>
