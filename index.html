<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berber Yönetim Paneli</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#0f0f0f;
  color:white;
  padding:15px;
}
h1 { color:gold; text-align:center; }
section {
  background:#1c1c1c;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
}
select, button, input {
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
button {
  background:gold;
  font-weight:bold;
}
ul { list-style:none; padding:0; }
li {
  background:#2a2a2a;
  margin-top:6px;
  padding:10px;
  border-radius:8px;
}
.kirmizi { color:#ff5252; }
.yesil { color:#4caf50; }
</style>
</head>

<body>

<h1>💈 Berber Kasa Paneli</h1>

<section>
<h2>İşlem Ekle</h2>

<select id="personel">
  <option>Ahmet</option>
  <option>Mehmet</option>
  <option>Ali</option>
</select>

<select id="islem">
  <option value="sac">Saç</option>
  <option value="sakal">Sakal</option>
  <option value="cocuk">Çocuk</option>
</select>

<button onclick="islemEkle()">İşlem Kaydet</button>
</section>

<section>
<h2>Fiyat Ayarları</h2>
<label>Saç Fiyatı</label>
<input type="number" id="fiyatSac">

<label>Sakal Fiyatı</label>
<input type="number" id="fiyatSakal">

<label>Çocuk Fiyatı</label>
<input type="number" id="fiyatCocuk">

<button onclick="fiyatKaydet()">Fiyatları Güncelle</button>
</section>

<section>
<h2>Günlük Kasa</h2>
<ul id="kasaListesi"></ul>
<h3 id="toplam">Toplam: 0 TL</h3>
</section>

<section>
<h2>Aylık Hesap</h2>
<label>Aylık Gider (TL)</label>
<input type="number" id="gider" value="40000">

<button onclick="karHesapla()">Kâr Hesapla</button>
<h3 id="karSonuc"></h3>
</section>

<script>
let kasa = JSON.parse(localStorage.getItem("kasa")) || [];

let fiyatlar = JSON.parse(localStorage.getItem("fiyatlar")) || {
  sac:250,
  sakal:100,
  cocuk:200
};

function fiyatInputGuncelle(){
  document.getElementById("fiyatSac").value = fiyatlar.sac;
  document.getElementById("fiyatSakal").value = fiyatlar.sakal;
  document.getElementById("fiyatCocuk").value = fiyatlar.cocuk;
}

function fiyatKaydet(){
  fiyatlar.sac = Number(document.getElementById("fiyatSac").value);
  fiyatlar.sakal = Number(document.getElementById("fiyatSakal").value);
  fiyatlar.cocuk = Number(document.getElementById("fiyatCocuk").value);

  localStorage.setItem("fiyatlar", JSON.stringify(fiyatlar));
  alert("Fiyatlar güncellendi");
}

function islemEkle(){
  let personel = document.getElementById("personel").value;
  let islem = document.getElementById("islem").value;
  let tutar = fiyatlar[islem];

  kasa.push({ personel, islem, tutar, tarih:new Date().toLocaleDateString() });
  localStorage.setItem("kasa", JSON.stringify(kasa));
  listeGuncelle();
}

function listeGuncelle(){
  let liste = document.getElementById("kasaListesi");
  liste.innerHTML = "";
  let toplam = 0;

  kasa.forEach((k,i)=>{
    let li = document.createElement("li");
    li.innerHTML = `${k.tarih} - <b>${k.personel}</b> | ${k.islem} : ${k.tutar} TL 
    <button onclick="sil(${i})" style="background:#ff5252;margin-top:5px;">Sil</button>`;
    liste.appendChild(li);
    toplam += k.tutar;
  });

  document.getElementById("toplam").textContent = "Toplam: " + toplam + " TL";
}

function sil(index){
  kasa.splice(index,1);
  localStorage.setItem("kasa", JSON.stringify(kasa));
  listeGuncelle();
}

function karHesapla(){
  let toplam = kasa.reduce((t,k)=>t+k.tutar,0);
  let gider = Number(document.getElementById("gider").value);
  let kar = toplam - gider;

  document.getElementById("karSonuc").innerHTML =
    "Net Kâr: <span class='"+(kar>=0?"yesil":"kirmizi")+"'>"+kar+" TL</span>";
}

fiyatInputGuncelle();
listeGuncelle();
</script>

</body>
</html>
