<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahmet Tekeli - Gelişmiş Kasa</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .p-btn { transition: all 0.2s; border: 2px solid transparent; }
        .active-p { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-gray-100 p-3 text-slate-900">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-6 min-h-[95vh] flex flex-col border border-gray-100">
        
        <div class="text-center mb-4">
            <h1 class="text-xl font-black text-gray-800 tracking-tighter uppercase">AHMET TEKELİ</h1>
            <p class="text-[9px] font-bold text-red-600 tracking-widest uppercase italic">CANLI HESAP SİSTEMİ</p>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="pSec('Sahip')" id="btnSahip" class="p-btn active-p bg-gray-50 p-2 rounded-xl text-[10px] font-bold uppercase">Dükkan</button>
            <button onclick="pSec('Ercan')" id="btnErcan" class="p-btn bg-gray-50 p-2 rounded-xl text-[10px] font-bold uppercase">Ercan</button>
            <button onclick="pSec('Efe')" id="btnEfe" class="p-btn bg-gray-50 p-2 rounded-xl text-[10px] font-bold uppercase">Efe</button>
            <button onclick="pSec('Gider')" id="btnGider" class="p-btn bg-red-50 text-red-600 p-2 rounded-xl text-[10px] font-bold uppercase">GİDER</button>
        </div>
        
        <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="hSec('Saç', 500)" class="bg-white border p-2 rounded-xl shadow-sm text-[11px] font-bold uppercase">Saç</button>
            <button onclick="hSec('Sakal', 250)" class="bg-white border p-2 rounded-xl shadow-sm text-[11px] font-bold uppercase">Sakal</button>
            <button onclick="hSec('Full', 700)" class="bg-blue-50 border border-blue-100 p-2 rounded-xl shadow-sm text-[11px] font-black text-blue-700 uppercase">Full</button>
            <button onclick="hSec('Yıkama', 100)" class="bg-white border p-2 rounded-xl shadow-sm text-[11px] font-bold uppercase">Yıkama</button>
        </div>

        <div class="bg-gray-50 p-3 rounded-2xl mb-4 border border-gray-200 shadow-inner">
            <div class="flex gap-2 mb-2">
                <input type="text" id="h" placeholder="İşlem/Gider Adı" class="w-1/2 p-3 rounded-xl text-sm outline-none border border-gray-200 shadow-sm">
                <input type="number" id="t" placeholder="₺" class="w-1/4 p-3 rounded-xl text-sm font-black outline-none border border-gray-200 shadow-sm">
                <select id="y" class="w-1/4 p-3 rounded-xl bg-white text-[10px] font-bold border border-gray-200">
                    <option value="Nakit">NAKİT</option>
                    <option value="Kart">KART</option>
                </select>
            </div>
            <button onclick="kaydet()" id="kayitBtn" class="w-full bg-blue-600 text-white p-3 rounded-xl font-black shadow-lg uppercase text-xs tracking-widest">KAYDET</button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-orange-50 p-3 rounded-2xl border border-orange-200">
                <p class="text-[9px] font-bold text-orange-600 uppercase">Ercan (%50 Pay)</p>
                <p id="pErcan" class="text-xl font-black text-orange-800">0 ₺</p>
                <p id="cErcan" class="text-[8px] text-orange-400 font-bold uppercase mt-1">Ciro: 0₺</p>
            </div>
            <div class="bg-purple-50 p-3 rounded-2xl border border-purple-200">
                <p class="text-[9px] font-bold text-purple-600 uppercase">Efe (%30 Pay)</p>
                <p id="pEfe" class="text-xl font-black text-purple-800">0 ₺</p>
                <p id="cEfe" class="text-[8px] text-purple-400 font-bold uppercase mt-1">Ciro: 0₺</p>
            </div>
        </div>

        <div class="bg-gray-900 text-white p-5 rounded-[2rem] shadow-xl">
            <div class="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
                <div>
                    <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Toplam Ciro</p>
                    <p id="cToplam" class="text-2xl font-black">0 ₺</p>
                </div>
                <div class="text-right">
                    <p class="text-[9px] font-bold text-red-400 uppercase tracking-widest">Toplam Gider</p>
                    <p id="gToplam" class="text-2xl font-black text-red-400">0 ₺</p>
                </div>
            </div>
            <div class="flex justify-between items-end">
                <div class="space-y-1">
                    <p class="text-[10px] text-emerald-400 font-bold">NAKİT: <span id="nToplam">0₺</span></p>
                    <p class="text-[10px] text-blue-400 font-bold">KART: <span id="kToplam">0₺</span></p>
                </div>
                <div class="bg-white/10 p-2 rounded-xl text-right">
                    <p class="text-[8px] font-bold text-gray-400 uppercase">Net Kalan (Dükkan)</p>
                    <p id="netKalan" class="text-lg font-black text-emerald-400">0 ₺</p>
                </div>
            </div>
        </div>

        <div class="mt-auto pt-4">
            <button onclick="kasaSifirla()" class="w-full py-3 text-gray-400 text-[10px] font-bold border-2 border-dashed border-gray-200 rounded-2xl uppercase tracking-[0.3em] active:text-red-600 active:border-red-300">Günü Kapat</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDpT9QsG7V23KtKZMVXmIfeX_Mg-eAeBZM",
            databaseURL: "https://berberkasa-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "berberkasa",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let p = 'Sahip';

        function pSec(secilen) {
            p = secilen;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
            document.getElementById('btn' + secilen).classList.add('active-p');
        }

        function hSec(ad, fiyat) {
            document.getElementById('h').value = ad;
            document.getElementById('t').value = fiyat;
        }

        function kaydet() {
            const h = document.getElementById('h').value;
            const t = parseFloat(document.getElementById('t').value);
            const y = document.getElementById('y').value;
            if(!h || isNaN(t)) return;

            const btn = document.getElementById('kayitBtn');
            btn.innerText = "KAYDEDİLİYOR...";
            btn.disabled = true;

            db.ref('kasa/').push({
                h, t, y, p,
                tarih: Date.now()
            }).then(() => {
                document.getElementById('h').value = '';
                document.getElementById('t').value = '';
                btn.innerText = "KAYDET";
                btn.disabled = false;
            });
        }

        db.ref('kasa/').on('value', (snapshot) => {
            const veriler = snapshot.val();
            let nT=0, kT=0, eCiro=0, fCiro=0, gTop=0;

            if (veriler) {
                Object.values(veriler).forEach(i => {
                    const tutar = parseFloat(i.t);
                    if (i.p === 'Gider') {
                        gTop += tutar;
                    } else {
                        if (i.y === 'Nakit') nT += tutar; else kT += tutar;
                        if (i.p === 'Ercan') eCiro += tutar;
                        if (i.p === 'Efe') fCiro += tutar;
                    }
                });
            }

            const ePay = eCiro * 0.50; // Ercan %50
            const fPay = fCiro * 0.30; // Efe %30
            const toplamCiro = nT + kT;
            const netKalan = toplamCiro - (ePay + fPay + gTop);

            document.getElementById('cToplam').innerText = toplamCiro + " ₺";
            document.getElementById('gToplam').innerText = gTop + " ₺";
            document.getElementById('nToplam').innerText = nT + "₺";
            document.getElementById('kToplam').innerText = kT + "₺";
            
            document.getElementById('cErcan').innerText = "Ciro: " + eCiro + "₺";
            document.getElementById('pErcan').innerText = ePay + " ₺";
            
            document.getElementById('cEfe').innerText = "Ciro: " + fCiro + "₺";
            document.getElementById('pEfe').innerText = fPay + " ₺";
            
            document.getElementById('netKalan').innerText = netKalan.toFixed(0) + " ₺";
        });

        function kasaSifirla() {
            if(confirm("Tüm verileri sıfırlayıp günü kapatmak istediğine emin misin Ahmet abi?")) {
                db.ref('kasa/').remove();
            }
        }
    </script>
</body>
</html>
