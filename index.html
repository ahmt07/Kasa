<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahmet Tekeli - VIP Kasa V7</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .p-btn { transition: all 0.2s; border: 2px solid transparent; background-color: #f8fafc; color: #64748b; }
        .active-p { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; font-weight: 900 !important; }
        .islem-row:nth-child(even) { background-color: #f9fafb; }
    </style>
</head>
<body class="bg-slate-50 p-2 text-slate-900">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-5 min-h-[95vh] flex flex-col border border-slate-100">
        
        <div class="text-center mb-3">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter uppercase leading-none">AHMET TEKELİ</h1>
            <p id="bugunTarih" class="text-[10px] font-bold text-blue-600 tracking-widest uppercase mt-1 italic"></p>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-3">
            <button onclick="pSec('Sahip')" id="btnSahip" class="p-btn active-p p-2 rounded-xl text-[9px] font-bold uppercase leading-tight">AHMET</button>
            <button onclick="pSec('Ercan')" id="btnErcan" class="p-btn p-2 rounded-xl text-[9px] font-bold uppercase leading-tight">ERCAN</button>
            <button onclick="pSec('Efe')" id="btnEfe" class="p-btn p-2 rounded-xl text-[9px] font-bold uppercase leading-tight">EFE</button>
            <button onclick="pSec('Gider')" id="btnGider" class="p-btn bg-red-50 text-red-600 p-2 rounded-xl text-[9px] font-bold uppercase">GİDER</button>
        </div>
        
        <div class="bg-slate-100 p-3 rounded-2xl mb-3 shadow-inner border border-slate-200">
            <div class="flex gap-2 mb-2">
                <input type="text" id="h" placeholder="İşlem" class="w-1/2 p-3 rounded-xl border-none text-xs font-bold outline-none shadow-sm">
                <input type="number" id="t" placeholder="₺" class="w-1/2 p-3 rounded-xl border-none text-lg font-black outline-none shadow-sm text-blue-600">
            </div>
            <div class="flex gap-2">
                <select id="y" class="w-full p-3 rounded-xl bg-white text-[10px] font-black outline-none border border-gray-200">
                    <option value="Nakit">NAKİT</option>
                    <option value="Kart">KART</option>
                    <option value="Iban">IBAN</option>
                </select>
                <button onclick="kaydet()" id="kayitBtn" class="bg-slate-800 text-white px-5 rounded-xl font-bold uppercase text-[9px] active:scale-95 transition-all">KAYDET</button>
            </div>
        </div>

        <div class="bg-blue-600 text-white p-4 rounded-[2rem] text-center mb-3 shadow-lg border-2 border-blue-400">
            <p class="text-[9px] font-black uppercase mb-1 opacity-80">EMİNE TEKELİ (IBAN)</p>
            <p id="ibanText" class="text-xl font-mono font-black mb-2 tracking-tighter">TR95 0013 4000 0160 3155 6000 01</p>
            <button onclick="kopyalaIban()" class="bg-white text-blue-700 text-[9px] px-6 py-1.5 rounded-full font-black uppercase">Kopyala</button>
        </div>

        <div class="flex-grow bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden mb-3 flex flex-col">
            <p class="bg-slate-200 text-[9px] font-black p-2 text-center uppercase tracking-widest text-slate-500 italic">GÜNLÜK HAREKET DÖKÜMÜ</p>
            <div class="overflow-y-auto max-h-40 flex-grow" id="islemListesi"></div>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-3 text-center">
            <div class="bg-orange-50 p-2 rounded-xl border border-orange-200 font-black">
                <p class="text-[8px] text-orange-600 uppercase">ERCAN %50</p>
                <p id="pErcan" class="text-xs">0 ₺</p>
            </div>
            <div class="bg-purple-50 p-2 rounded-xl border border-purple-200 font-black">
                <p class="text-[8px] text-purple-600 uppercase">EFE %30</p>
                <p id="pEfe" class="text-xs">0 ₺</p>
            </div>
        </div>

        <div class="bg-slate-900 text-white p-4 rounded-3xl shadow-xl mb-3">
            <div class="flex justify-between items-center mb-1">
                <p class="text-[10px] font-bold text-slate-400 uppercase italic">Dükkan Net Kâr</p>
                <p id="netKalan" class="text-2xl font-black text-emerald-400">0 ₺</p>
            </div>
            <div class="flex justify-between text-[9px] font-bold text-slate-400 border-t border-white/10 pt-1">
                <span>Ciro: <span id="cToplam" class="text-white">0₺</span></span>
                <span>Gider: <span id="gToplam" class="text-red-400">0₺</span></span>
            </div>
        </div>

        <button onclick="kasaSifirla()" class="w-full py-4 bg-emerald-600 text-white text-[11px] font-black rounded-2xl uppercase mb-3 shadow-lg active:scale-95">GÜNÜ KAPAT VE ARŞİVLE</button>

        <div class="bg-blue-600 text-white p-3 rounded-2xl text-center shadow-md">
            <p id="aylikBaslik" class="text-[8px] font-black uppercase opacity-70">AYLIK TOPLAM</p>
            <h2 id="aylikCiro" class="text-xl font-black">0 ₺</h2>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDpT9QsG7V23KtKZMVXmIfeX_Mg-eAeBZM",
            databaseURL: "https://berberkasa-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "berberkasa",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let p = 'Sahip';
        let hesaplanmisNet = 0;

        // TARİH AYARLARI
        const simdi = new Date();
        const bugunFormatli = simdi.toLocaleDateString('tr-TR', { day:'2-digit', month:'long', year:'numeric' });
        document.getElementById('bugunTarih').innerText = bugunFormatli;
        
        const ayID = simdi.getFullYear() + "-" + (simdi.getMonth() + 1);
        const ayAdi = simdi.toLocaleDateString('tr-TR', { month: 'long' }).toUpperCase();
        document.getElementById('aylikBaslik').innerText = ayAdi + " AYI TOPLAM NET";

        function pSec(sec) {
            p = sec;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
            document.getElementById('btn' + sec).classList.add('active-p');
        }

        function kopyalaIban() {
            navigator.clipboard.writeText(document.getElementById('ibanText').innerText.replace(/\s/g, ''));
            alert("İban Kopyalandı!");
        }

        function kaydet() {
            const h = document.getElementById('h').value;
            const t = parseFloat(document.getElementById('t').value);
            const y = document.getElementById('y').value;
            if(!h || isNaN(t)) return;

            db.ref('kasa/').push({ 
                h, t, y, p, 
                tarih: new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}),
                tamTarih: bugunFormatli
            });
            
            document.getElementById('h').value = '';
            document.getElementById('t').value = '';
        }

        db.ref('kasa/').on('value', (snapshot) => {
            const veriler = snapshot.val();
            const listDiv = document.getElementById('islemListesi');
            listDiv.innerHTML = "";
            let toplamCiro=0, gTop=0, eCiro=0, fCiro=0;

            if (veriler) {
                const rev = Object.values(veriler).reverse();
                rev.forEach(i => {
                    const t = parseFloat(i.t);
                    listDiv.innerHTML += `
                        <div class="islem-row flex justify-between items-center p-2.5 border-b border-slate-100 text-[10px]">
                            <div class="flex flex-col">
                                <span class="font-black text-slate-800 uppercase">${i.h}</span>
                                <span class="text-[8px] opacity-60">${i.tarih} - ${i.p}</span>
                            </div>
                            <div class="text-right">
                                <span class="font-black ${i.p==='Gider'?'text-red-500':'text-slate-700'}">${t} ₺</span>
                                <div class="text-[7px] uppercase opacity-40 font-bold">${i.y}</div>
                            </div>
                        </div>`;

                    if (i.p === 'Gider') gTop += t;
                    else {
                        toplamCiro += t;
                        if(i.p==='Ercan') eCiro += t;
                        if(i.p==='Efe') fCiro += t;
                    }
                });
            }

            const ePay = eCiro * 0.50; 
            const fPay = fCiro * 0.30; 
            hesaplanmisNet = Math.floor(toplamCiro - (ePay + fPay + gTop));

            document.getElementById('cToplam').innerText = toplamCiro + " ₺";
            document.getElementById('gToplam').innerText = gTop + " ₺";
            document.getElementById('pErcan').innerText = Math.floor(ePay) + " ₺";
            document.getElementById('pEfe').innerText = Math.floor(fPay) + " ₺";
            document.getElementById('netKalan').innerText = hesaplanmisNet + " ₺";
        });

        db.ref('aylikNet/' + ayID).on('value', (snapshot) => {
            document.getElementById('aylikCiro').innerText = Math.floor(snapshot.val() || 0).toLocaleString('tr-TR') + " ₺";
        });

        function kasaSifirla() {
            if(confirm("Günü kapatıyorsun Ahmet abi? " + bugunFormatli + " tarihindeki kâr kumbaraya işlenecek.")) {
                db.ref('aylikNet/' + ayID).transaction(curr => (curr || 0) + hesaplanmisNet);
                db.ref('kasa/').remove();
                alert("Günlük kasa başarıyla devredildi.");
            }
        }
    </script>
</body>
</html>
