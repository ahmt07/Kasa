<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Berber Kasa Sistemi</title>
<style>
body{font-family:Arial;background:#111;color:#fff;text-align:center}
button,input,select{padding:10px;margin:5px;font-size:16px}
table{margin:auto;border-collapse:collapse;width:90%}
td,th{border:1px solid #555;padding:8px}
.nav button{font-size:18px}
.hidden{display:none}
</style>
</head>
<body>

<h1>💈 Berber POS Sistemi</h1>

<div class="nav">
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('appointments')">Randevular</button>
<button onclick="show('sales')">Satış</button>
<button onclick="show('staff')">Personel</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
<h2>📊 Günlük Özet</h2>
<p id="totalCustomers"></p>
<p id="totalRevenue"></p>
<p id="cashTotal"></p>
<p id="cardTotal"></p>
</div>

<!-- APPOINTMENTS -->
<div id="appointments" class="hidden">
<h2>📅 Randevu Ekle</h2>
<input id="a_name" placeholder="Müşteri">
<input id="a_staff" placeholder="Personel">
<input id="a_time" placeholder="Saat (10:30)">
<button onclick="addAppointment()">Kaydet</button>

<table>
<thead><tr><th>Müşteri</th><th>Personel</th><th>Saat</th></tr></thead>
<tbody id="appointmentList"></tbody>
</table>
</div>

<!-- SALES -->
<div id="sales" class="hidden">
<h2>💳 Satış Ekle</h2>
<input id="s_customer" placeholder="Müşteri">
<input id="s_service" placeholder="İşlem">
<input id="s_staff" placeholder="Personel">
<input id="s_amount" placeholder="Tutar">
<select id="s_payment">
<option>Nakit</option>
<option>Kart</option>
</select>
<button onclick="addSale()">Satışı Kaydet</button>

<table>
<thead><tr><th>Müşteri</th><th>İşlem</th><th>Personel</th><th>Tutar</th></tr></thead>
<tbody id="salesList"></tbody>
</table>
</div>

<!-- STAFF -->
<div id="staff" class="hidden">
<h2>👨‍🔧 Personel Performans</h2>
<table>
<thead><tr><th>Personel</th><th>Müşteri</th><th>Ciro</th></tr></thead>
<tbody id="staffList"></tbody>
</table>
</div>

<script>
function show(id){
 document.querySelectorAll("div[id]").forEach(d=>d.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 loadAll();
}

function getData(key){return JSON.parse(localStorage.getItem(key)||"[]")}
function setData(key,data){localStorage.setItem(key,JSON.stringify(data))}

/* APPOINTMENTS */
function addAppointment(){
 let data=getData("appointments");
 data.push({
  name:a_name.value,
  staff:a_staff.value,
  time:a_time.value
 });
 setData("appointments",data);
 loadAppointments();
}

function loadAppointments(){
 let data=getData("appointments");
 appointmentList.innerHTML="";
 data.forEach(a=>{
  appointmentList.innerHTML+=`<tr><td>${a.name}</td><td>${a.staff}</td><td>${a.time}</td></tr>`;
 });
}

/* SALES */
function addSale(){
 let data=getData("sales");
 data.push({
  customer:s_customer.value,
  service:s_service.value,
  staff:s_staff.value,
  amount:Number(s_amount.value),
  payment:s_payment.value
 });
 setData("sales",data);
 loadSales();
}

function loadSales(){
 let data=getData("sales");
 salesList.innerHTML="";
 data.forEach(s=>{
  salesList.innerHTML+=`<tr><td>${s.customer}</td><td>${s.service}</td><td>${s.staff}</td><td>₺${s.amount}</td></tr>`;
 });
}

/* STAFF */
function loadStaff(){
 let sales=getData("sales");
 let map={};
 sales.forEach(s=>{
  if(!map[s.staff]) map[s.staff]={count:0,total:0};
  map[s.staff].count++;
  map[s.staff].total+=s.amount;
 });
 staffList.innerHTML="";
 Object.keys(map).forEach(p=>{
  staffList.innerHTML+=`<tr><td>${p}</td><td>${map[p].count}</td><td>₺${map[p].total}</td></tr>`;
 });
}

/* DASHBOARD */
function loadDashboard(){
 let sales=getData("sales");
 totalCustomers.innerText="Toplam Müşteri: "+sales.length;
 totalRevenue.innerText="Toplam Ciro: ₺"+sales.reduce((a,b)=>a+b.amount,0);
 cashTotal.innerText="Nakit: ₺"+sales.filter(s=>s.payment==="Nakit").reduce((a,b)=>a+b.amount,0);
 cardTotal.innerText="Kart: ₺"+sales.filter(s=>s.payment==="Kart").reduce((a,b)=>a+b.amount,0);
}

function loadAll(){
 loadAppointments();
 loadSales();
 loadStaff();
 loadDashboard();
}

loadAll();
</script>
</body>
</html>
