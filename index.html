<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahmet Tekeli - Berber Kasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .p-btn { border: 2px solid transparent; }
        .active-p { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; }
    </style>
</head>
<body class="bg-gray-50 p-3">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-6 border border-gray-100">
        
        <div class="text-center mb-6">
            <h1 class="text-xl font-black text-gray-800 uppercase tracking-tighter">AHMET TEKELİ</h1>
            <p class="text-[10px] font-bold text-blue-600 tracking-[0.2em]">PROFESYONEL KASA SİSTEMİ</p>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="personelSec('Sahip')" id="btnSahip" class="p-btn active-p bg-gray-100 text-gray-600 p-3 rounded-2xl text-xs font-bold transition-all">Dükkan</button>
            <button onclick="personelSec('Ercan')" id="btnErcan" class="p-btn bg-gray-100 text-gray-600 p-3 rounded-2xl text-xs font-bold transition-all">Ercan</button>
            <button onclick="personelSec('Efe')" id="btnEfe" class="p-btn bg-gray-100 text-gray-600 p-3 rounded-2xl text-xs font-bold transition-all">Efe</button>
        </div>
        
        <div class="grid grid-cols-3 gap-2 mb-4">
            <button onclick="hizmetSec('Saç', 500)" class="bg-white border p-3 rounded-2xl shadow-sm active:scale-95 transition">
                <p class="text-[9px] text-gray-400 font-bold">SAÇ</p>
                <p class="text-sm font-black">500₺</p>
            </button>
            <button onclick="hizmetSec('Sakal', 250)" class="bg-white border p-3 rounded-2xl shadow-sm active:scale-95 transition">
                <p class="text-[9px] text-gray-400 font-bold">SAKAL</p>
                <p class="text-sm font-black">250₺</p>
            </button>
            <button onclick="hizmetSec('Saç+Sak', 700)" class="bg-blue-50 border border-blue-100 p-3 rounded-2xl shadow-sm active:scale-95 transition">
                <p class="text-[9px] text-blue-400 font-bold text-center">FULL</p>
                <p class="text-sm font-black text-blue-700">700₺</p>
            </button>
            <button onclick="hizmetSec('Çocuk', 450)" class="bg-white border p-3 rounded-2xl shadow-sm active:scale-95 transition">
                <p class="text-[9px] text-gray-400 font-bold">ÇOCUK</p>
                <p class="text-sm font-black">450₺</p>
            </button>
            <button onclick="hizmetSec('Boya', 1000)" class="bg-gray-800 text-white p-3 rounded-2xl shadow-sm col-span-2 flex justify-between items-center px-4 active:scale-95 transition">
                <span class="text-xs font-bold">SAÇ BOYA</span>
                <span class="text-sm font-black">1000₺</span>
            </button>
        </div>

        <div class="bg-gray-100 p-3 rounded-2xl mb-6">
            <div class="flex gap-2 mb-2">
                <input type="text" id="hizmet" placeholder="İşlem" class="w-1/2 p-3 rounded-xl border-none text-sm outline-none shadow-inner">
                <input type="number" id="tutar" placeholder="₺" class="w-1/4 p-3 rounded-xl border-none text-sm font-black outline-none shadow-inner">
                <select id="yontem" class="w-1/4 p-3 rounded-xl bg-white text-[10px] font-bold outline-none">
                    <option value="Nakit">NAKİT</option>
                    <option value="Kart">KART</option>
                </select>
            </div>
            <button onclick="islemEkle()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-black shadow-lg active:bg-blue-700 transition">KAYDET</button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-orange-50 p-4 rounded-2xl border border-orange-100">
                <p class="text-[10px] font-bold text-orange-600 uppercase">ERCAN CİRO</p>
                <p id="ciroErcan" class="text-xl font-black text-orange-800">0 ₺</p>
            </div>
            <div class="bg-purple-50 p-4 rounded-2xl border border-purple-100">
                <p class="text-[10px] font-bold text-purple-600 uppercase">EFE CİRO</p>
                <p id="ciroEfe" class="text-xl font-black text-purple-800">0 ₺</p>
            </div>
        </div>

        <div class="bg-gray-900 text-white p-5 rounded-[2rem] mb-6">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3 mb-3">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Genel Toplam</span>
                <span id="toplamCiro" class="text-2xl font-black">0 ₺</span>
            </div>
            <div class="flex justify-between text-[11px] font-bold">
                <span class="text-emerald-400">NAKİT: <span id="tNakit">0₺</span></span>
                <span class="text-blue-400">KART: <span id="tKart">0₺</span></span>
            </div>
        </div>

        <div class="max-h-40 overflow-y-auto px-1">
            <ul id="islemListesi" class="space-y-2"></ul>
        </div>
        
        <button onclick="kasaSifirla()" class="mt-8 w-full py-2 text-gray-300 text-[9px] font-bold border border-dashed border-gray-200 rounded-xl uppercase tracking-widest hover:text-red-400">Günü Kapat</button>
    </div>

    <script>
        let islemler = JSON.parse(localStorage.getItem('tekeli_kasa')) || [];
        let aktifPersonel = 'Sahip';

        function personelSec(p) {
            aktifPersonel = p;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
            document.getElementById('btn' + p).classList.add('active-p');
        }

        function hizmetSec(ad, fiyat) {
            document.getElementById('hizmet').value = ad;
            document.getElementById('tutar').value = fiyat;
        }

        function islemEkle() {
            const h = document.getElementById('hizmet').value;
            const t = parseFloat(document.getElementById('tutar').value);
            const y = document.getElementById('yontem').value;
            if(!h || isNaN(t)) return;

            islemler.unshift({h, t, y, p: aktifPersonel, tarih: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})});
            localStorage.setItem('tekeli_kasa', JSON.stringify(islemler));
            render();
            document.getElementById('hizmet').value = '';
            document.getElementById('tutar').value = '';
        }

        function render() {
            const liste = document.getElementById('islemListesi');
            let nT = 0, kT = 0, ercanCiro = 0, efeCiro = 0;
            liste.innerHTML = '';

            islemler.forEach((i) => {
                const t = parseFloat(i.t);
                if(i.y === 'Nakit') nT += t; else kT += t;
                if(i.p === 'Ercan') ercanCiro += t;
                if(i.p === 'Efe') efeCiro += t;

                liste.innerHTML += `
                    <li class="flex justify-between items-center p-3 bg-white rounded-xl text-[11px] border shadow-sm">
                        <div class="flex flex-col">
                            <span class="font-black text-gray-700">${i.p}</span>
                            <span class="text-gray-400">${i.h}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-black text-gray-800">${t}₺</span>
                            <span class="block text-[8px] font-bold ${i.y === 'Nakit' ? 'text-emerald-500' : 'text-blue-500'} uppercase">${i.y}</span>
                        </div>
                    </li>`;
            });

            document.getElementById('toplamCiro').innerText = (nT + kT) + " ₺";
            document.getElementById('tNakit').innerText = nT + "₺";
            document.getElementById('tKart').innerText = kT + "₺";
            document.getElementById('ciroErcan').innerText = ercanCiro + " ₺";
            document.getElementById('ciroEfe').innerText = efeCiro + " ₺";
        }

        function kasaSifirla() {
            if(confirm("Sayın Ahmet Tekeli, bugünü kapatmak ve kayıtları temizlemek istediğinize emin misiniz?")) {
                islemler = [];
                localStorage.removeItem('tekeli_kasa');
                render();
            }
        }
        render();
    </script>
</body>
</html>
