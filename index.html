<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berber Kasa Sistemi</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:#fff;
    margin:0;
    padding:20px;
}
.container{max-width:900px;margin:auto;}
h1{text-align:center;}
.card{
    background:#1e1e1e;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
}
input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:none;
}
button{
    background:#0f62fe;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
button:hover{background:#0353e9;}
.list-item{
    display:flex;
    justify-content:space-between;
    background:#2a2a2a;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
}
.stats{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    margin-top:10px;
}
</style>
</head>
<body>
<div class="container">
<h1>💈 Berber Kasa & Randevu Sistemi</h1>

<div class="card">
<h2>Hizmet Ekle</h2>
<input id="serviceName" placeholder="Hizmet adı (Saç, Sakal)">
<input id="servicePrice" type="number" placeholder="Fiyat">
<button onclick="addService()">Hizmet Ekle</button>
</div>

<div class="card">
<h2>Müşteri İşlem</h2>
<select id="serviceSelect"></select>
<select id="staffSelect">
<option>Personel 1</option>
<option>Personel 2</option>
<option>Personel 3</option>
</select>
<button onclick="addSale()">Satış Ekle</button>
</div>

<div class="card">
<h2>Bugünkü İşlemler</h2>
<div id="salesList"></div>
</div>

<div class="card">
<h2>Günlük İstatistik</h2>
<div class="stats">
<div>👥 Müşteri: <span id="totalCustomers">0</span></div>
<div>💰 Ciro: <span id="totalRevenue">0</span> ₺</div>
</div>
</div>

<div class="card">
<h2>Personel Kazanç</h2>
<div id="staffReport"></div>
</div>
</div>

<script>
let services = JSON.parse(localStorage.getItem("services")) || [];
let sales = JSON.parse(localStorage.getItem("sales")) || [];

function saveData(){
    localStorage.setItem("services",JSON.stringify(services));
    localStorage.setItem("sales",JSON.stringify(sales));
}

function addService(){
    let name=document.getElementById("serviceName").value;
    let price=parseFloat(document.getElementById("servicePrice").value);
    if(!name || !price) return alert("Bilgi gir!");
    services.push({name,price});
    saveData();
    renderServices();
    document.getElementById("serviceName").value="";
    document.getElementById("servicePrice").value="";
}

function renderServices(){
    let select=document.getElementById("serviceSelect");
    select.innerHTML="";
    services.forEach((s,i)=>{
        let opt=document.createElement("option");
        opt.value=i;
        opt.text=s.name+" - "+s.price+"₺";
        select.appendChild(opt);
    });
}

function addSale(){
    if(services.length==0) return alert("Önce hizmet ekle");
    let serviceIndex=document.getElementById("serviceSelect").value;
    let staff=document.getElementById("staffSelect").value;
    let service=services[serviceIndex];
    sales.push({
        name:service.name,
        price:service.price,
        staff:staff,
        date:new Date().toLocaleTimeString()
    });
    saveData();
    renderSales();
}

function renderSales(){
    let list=document.getElementById("salesList");
    list.innerHTML="";
    let total=0;
    sales.forEach(s=>{
        total+=s.price;
        let div=document.createElement("div");
        div.className="list-item";
        div.innerHTML=`${s.name} - ${s.price}₺ <span>${s.staff}</span>`;
        list.appendChild(div);
    });
    document.getElementById("totalCustomers").innerText=sales.length;
    document.getElementById("totalRevenue").innerText=total;
    renderStaffReport();
}

function renderStaffReport(){
    let report={};
    sales.forEach(s=>{
        if(!report[s.staff]) report[s.staff]=0;
        report[s.staff]+=s.price;
    });
    let area=document.getElementById("staffReport");
    area.innerHTML="";
    for(let staff in report){
        area.innerHTML+=`<div class="list-item">${staff} <b>${report[staff]}₺</b></div>`;
    }
}

renderServices();
renderSales();
</script>
</body>
</html>
