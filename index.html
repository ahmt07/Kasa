<!-- ===============================
AHMET TEKELI BARBER ERP SYSTEM
Tek Parça Profesyonel Salon Yönetim Paneli
================================ -->

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ahmet Tekeli Yönetim Paneli</title>

<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#fff}
header{background:#020617;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.container{padding:15px}
.card{background:#020617;border-radius:12px;padding:15px;margin:10px 0}
button{padding:10px;border:none;border-radius:8px;background:#2563eb;color:white;margin:5px}
input,select{padding:10px;border-radius:8px;border:none;width:100%;margin:5px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hidden{display:none}
.small{font-size:12px;color:#94a3b8}
</style>
</head>

<body>

<header>👑 Ahmet Tekeli Yönetim Paneli</header>

<div class="container">

<!-- LOGIN -->
<div id="loginPanel" class="card">
<h3>Admin Giriş</h3>
<input type="password" id="adminPass" placeholder="Şifre">
<button onclick="loginAdmin()">Giriş Yap</button>

<h3>Berber Giriş</h3>
<select id="barberSelect"></select>
<button onclick="loginBarber()">Panele Gir</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="grid">
<div class="card">💰 Günlük Kasa: <b id="dailyTotal">0</b>₺</div>
<div class="card">📅 Bugün İşlem: <b id="txnCount">0</b></div>
</div>
<button onclick="showAdmin()">Admin Panel</button>
<button onclick="showReports()">Raporlar</button>
<button onclick="logout()">Çıkış</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden card">
<h3>Admin Paneli</h3>

<h4>Berber Yönetimi</h4>
<input id="newBarber" placeholder="Yeni Berber İsmi">
<input id="newPercent" placeholder="Yüzde (%)">
<button onclick="addBarber()">Berber Ekle</button>
<div id="barberList"></div>

<h4>Hizmet Yönetimi</h4>
<input id="serviceName" placeholder="Hizmet Adı">
<input id="servicePrice" placeholder="Fiyat">
<button onclick="addService()">Hizmet Ekle</button>
<div id="serviceList"></div>

<h4>Gün Sonu</h4>
<button onclick="closeDay()">Günü Kapat</button>
</div>

<!-- BERBER PANEL -->
<div id="barberPanel" class="hidden card">
<h3 id="barberTitle"></h3>
<select id="serviceSelect"></select>
<button onclick="addTransaction()">İşlem Ekle</button>
<h4>Bugünkü İşler</h4>
<div id="txnList"></div>
</div>

<!-- REPORT PANEL -->
<div id="reportPanel" class="hidden card">
<h3>Aylık Rapor</h3>
<div id="monthlyReport"></div>
</div>

</div>

<script>
// VERİLER
let adminPassword="1234";
let currentUser=null;

let barbers=[
 {id:1,name:"Berber 1",percent:40},
 {id:2,name:"Berber 2",percent:50},
 {id:3,name:"Berber 3",percent:30}
];

let services=[
 {id:1,name:"Saç Kesim",price:300},
 {id:2,name:"Sakal",price:150}
];

let transactions=[];
let dailyClosed=[];

// LOGIN
function loginAdmin(){
 if(document.getElementById("adminPass").value===adminPassword){
  currentUser="admin";
  document.getElementById("loginPanel").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  renderAll();
 }else alert("Şifre yanlış");
}

function loginBarber(){
 let id=document.getElementById("barberSelect").value;
 currentUser=id;
 document.getElementById("loginPanel").classList.add("hidden");
 document.getElementById("barberPanel").classList.remove("hidden");
 document.getElementById("barberTitle").innerText=barbers.find(b=>b.id==id).name;
 renderServices();
 renderTxns();
}

function logout(){location.reload();}

// ADMIN
function showAdmin(){
 document.getElementById("adminPanel").classList.toggle("hidden");
 renderBarbers();
 renderServices();
}

function addBarber(){
 let name=document.getElementById("newBarber").value;
 let percent=parseInt(document.getElementById("newPercent").value);
 barbers.push({id:Date.now(),name,percent});
 renderBarbers();
 renderBarberSelect();
}

function renderBarbers(){
 let html="";
 barbers.forEach(b=>{
  html+=`<div class="small">${b.name} - %${b.percent}</div>`;
 });
 document.getElementById("barberList").innerHTML=html;
}

function addService(){
 services.push({
  id:Date.now(),
  name:serviceName.value,
  price:parseInt(servicePrice.value)
 });
 renderServices();
}

function renderServices(){
 let html="";
 services.forEach(s=>{
  html+=`<div class="small">${s.name} - ${s.price}₺</div>`;
 });
 document.getElementById("serviceList").innerHTML=html;

 let select="";
 services.forEach(s=>{
  select+=`<option value="${s.id}">${s.name}</option>`;
 });
 document.getElementById("serviceSelect").innerHTML=select;
}

function renderBarberSelect(){
 let html="";
 barbers.forEach(b=>{
  html+=`<option value="${b.id}">${b.name}</option>`;
 });
 document.getElementById("barberSelect").innerHTML=html;
}

// TRANSACTION
function addTransaction(){
 let serviceId=document.getElementById("serviceSelect").value;
 let service=services.find(s=>s.id==serviceId);
 transactions.push({
  barberId:currentUser,
  price:service.price,
  date:new Date().toLocaleDateString()
 });
 renderTxns();
 renderAll();
}

function renderTxns(){
 let html="";
 transactions.filter(t=>t.barberId==currentUser)
 .forEach(t=> html+=`<div class="small">${t.price}₺</div>`);
 document.getElementById("txnList").innerHTML=html;
}

// CLOSE DAY
function closeDay(){
 let report={date:new Date().toLocaleDateString(),barbers:[]};
 barbers.forEach(b=>{
  let total=transactions.filter(t=>t.barberId==b.id)
  .reduce((a,c)=>a+c.price,0);
  let earn=total*(b.percent/100);
  report.barbers.push({name:b.name,total,earn});
 });
 dailyClosed.push(report);
 alert("Gün kapatıldı");
}

// REPORT
function showReports(){
 document.getElementById("reportPanel").classList.toggle("hidden");
 let html="";
 dailyClosed.forEach(r=>{
  html+=`<div class="card">${r.date}`;
  r.barbers.forEach(b=>{
   html+=`<div class="small">${b.name}: ${b.total}₺ / Kazanç: ${b.earn.toFixed(0)}₺</div>`;
  });
  html+="</div>";
 });
 document.getElementById("monthlyReport").innerHTML=html;
}

// RENDER
function renderAll(){
 let total=transactions.reduce((a,c)=>a+c.price,0);
 document.getElementById("dailyTotal").innerText=total;
 document.getElementById("txnCount").innerText=transactions.length;
}

renderBarberSelect();
renderServices();
</script>

</body>
</html>
