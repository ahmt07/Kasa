<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahmet Tekeli - VIP Kasa</title>
    
    <link rel="apple-touch-icon" href="ikon.png">
    <link rel="icon" type="image/png" href="ikon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AT Kasa">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .p-btn { transition: all 0.2s; border: 2px solid transparent; }
        .active-p { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e40af !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-50 p-3 text-slate-900">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-6 min-h-[95vh] flex flex-col border border-slate-100">
        
        <div class="text-center mb-4">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter uppercase">AHMET TEKELİ</h1>
            <p class="text-[10px] font-bold text-blue-600 tracking-widest uppercase italic">Canlı Kasa & Hak Ediş Sistemi</p>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="pSec('Sahip')" id="btnSahip" class="p-btn active-p bg-slate-50 p-2 rounded-xl text-[10px] font-bold uppercase">Dükkan</button>
            <button onclick="pSec('Ercan')" id="btnErcan" class="p-btn bg-slate-50 p-2 rounded-xl text-[10px] font-bold uppercase">Ercan</button>
            <button onclick="pSec('Efe')" id="btnEfe" class="p-btn bg-slate-50 p-2 rounded-xl text-[10px] font-bold uppercase">Efe</button>
            <button onclick="pSec('Gider')" id="btnGider" class="p-btn bg-red-50 text-red-600 p-2 rounded-xl text-[10px] font-bold uppercase">GİDER</button>
        </div>
        
        <div class="grid grid-cols-3 gap-2 mb-4">
            <button onclick="hSec('Saç', 500)" class="bg-white border p-3 rounded-xl shadow-sm text-[11px] font-bold uppercase active:bg-slate-100">Saç 500</button>
            <button onclick="hSec('Sakal', 250)" class="bg-white border p-3 rounded-xl shadow-sm text-[11px] font-bold uppercase active:bg-slate-100">Sakal 250</button>
            <button onclick="hSec('Full', 700)" class="bg-blue-50 border border-blue-100 p-3 rounded-xl shadow-sm text-[11px] font-black text-blue-700 uppercase">Full 700</button>
            <button onclick="hSec('Çocuk', 450)" class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl shadow-sm text-[11px] font-black text-emerald-700 uppercase">Çocuk 450</button>
            <button onclick="hSec('Yıkama', 100)" class="bg-white border p-3 rounded-xl shadow-sm text-[11px] font-bold uppercase active:bg-slate-100">Yıkama 100</button>
            <button onclick="hSec('Boya', 1000)" class="bg-slate-800 text-white p-3 rounded-xl shadow-sm text-[11px] font-bold uppercase active:bg-black">Boya 1000</button>
        </div>

        <div class="bg-slate-100 p-4 rounded-3xl mb-4 shadow-inner border border-slate-200">
            <div class="flex gap-2 mb-3">
                <input type="text" id="h" placeholder="İşlem/Gider" class="w-1/2 p-3 rounded-xl border-none text-sm outline-none shadow-sm">
                <input type="number" id="t" placeholder="₺" class="w-1/4 p-3 rounded-xl border-none text-sm font-black outline-none shadow-sm">
                <select id="y" class="w-1/4 p-3 rounded-xl bg-white text-[10px] font-bold outline-none">
                    <option value="Nakit">NAKİT</option>
                    <option value="Kart">KART</option>
                </select>
            </div>
            <button onclick="kaydet()" id="kayitBtn" class="w-full bg-slate-800 text-white p-4 rounded-xl font-bold uppercase text-xs tracking-widest active:bg-black transition-all">SİSTEME KAYDET</button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-orange-50 p-3 rounded-2xl border border-orange-200 text-center shadow-sm">
                <p class="text-[9px] font-bold text-orange-600 uppercase italic">Ercan (%50 Pay)</p>
                <p id="pErcan" class="text-2xl font-black text-orange-800 tracking-tighter">0 ₺</p>
                <p id="cErcan" class="text-[8px] text-orange-400 font-bold uppercase mt-1">Bugün Ciro: 0₺</p>
            </div>
            <div class="bg-purple-50 p-3 rounded-2xl border border-purple-200 text-center shadow-sm">
                <p class="text-[9px] font-bold text-purple-600 uppercase italic">Efe (%30 Pay)</p>
                <p id="pEfe" class="text-2xl font-black text-purple-800 tracking-tighter">0 ₺</p>
                <p id="cEfe" class="text-[8px] text-purple-400 font-bold uppercase mt-1">Bugün Ciro: 0₺</p>
            </div>
        </div>

        <div class="bg-slate-900 text-white p-5 rounded-[2.5rem] shadow-xl mb-4">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Bugün Toplam</p>
                    <p id="cToplam" class="text-2xl font-black">0 ₺</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-red-400 uppercase tracking-widest">Bugün Gider</p>
                    <p id="gToplam" class="text-2xl font-black text-red-400">0 ₺</p>
                </div>
            </div>
            <div class="flex justify-between items-end">
                <div class="space-y-1 text-[11px] font-bold">
                    <p class="text-emerald-400 italic">NAKİT: <span id="nToplam">0₺</span></p>
                    <p class="text-blue-400 italic">KART: <span id="kToplam">0₺</span></p>
                </div>
                <div class="bg-white/10 p-4 rounded-2xl text-right">
                    <p class="text-[9px] font-bold text-slate-400 uppercase leading-tight">Dükkan Net<br>(Bugün)</p>
                    <p id="netKalan" class="text-xl font-black text-emerald-400">0 ₺</p>
                </div>
            </div>
        </div>

        <div class="bg-blue-600 text-white p-5 rounded-[2.5rem] shadow-xl relative overflow-hidden">
            <div class="relative z-10">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-80 mb-1">BU AYIN TOPLAM CİROSU</p>
                <h2 id="aylikCiro" class="text-4xl font-black tracking-tighter">0 ₺</h2>
            </div>
        </div>

        <div class="mt-auto pt-6 text-center">
            <button onclick="kasaSifirla()" class="w-full py-4 text-slate-400 text-[10px] font-bold border-2 border-dashed border-slate-200 rounded-2xl uppercase tracking-[0.4em] active:text-red-600 active:border-red-300 transition-all">Günü Kapat</button>
        </div>
    </div>

    <script>
        // FIREBASE AYARLARI
        const firebaseConfig = {
            apiKey: "AIzaSyDpT9QsG7V23KtKZMVXmIfeX_Mg-eAeBZM",
            databaseURL: "https://berberkasa-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "berberkasa",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let p = 'Sahip';

        function pSec(secilen) {
            p = secilen;
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
            document.getElementById('btn' + secilen).classList.add('active-p');
        }

        function hSec(ad, fiyat) {
            document.getElementById('h').value = ad;
            document.getElementById('t').value = fiyat;
        }

        function kaydet() {
            const h = document.getElementById('h').value;
            const t = parseFloat(document.getElementById('t').value);
            const y = document.getElementById('y').value;
            if(!h || isNaN(t)) return;

            const btn = document.getElementById('kayitBtn');
            btn.innerText = "İŞLENİYOR...";
            btn.disabled = true;

            const simdi = new Date();
            const ayID = simdi.getFullYear() + "-" + (simdi.getMonth() + 1);

            // Veriyi Firebase'e gönder
            db.ref('kasa/').push({ h, t, y, p, tarih: Date.now() });
            
            // Aylık toplamı güncelle (Giderler hariç)
            if(p !== 'Gider') {
                db.ref('aylik/' + ayID).transaction(current => (current || 0) + t);
            }

            setTimeout(() => {
                document.getElementById('h').value = '';
                document.getElementById('t').value = '';
                btn.innerText = "SİSTEME KAYDET";
                btn.disabled = false;
            }, 500);
        }

        // VERİLERİ ANLIK DİNLE
        db.ref('kasa/').on('value', (snapshot) => {
            const veriler = snapshot.val();
            let nT=0, kT=0, eCiro=0, fCiro=0, gTop=0;

            if (veriler) {
                Object.values(veriler).forEach(i => {
                    const tutar = parseFloat(i.t);
                    if (i.p === 'Gider') {
                        gTop += tutar;
                    } else {
                        if (i.y === 'Nakit') nT += tutar; else kT += tutar;
                        if (i.p === 'Ercan') eCiro += tutar;
                        else if (i.p === 'Efe') fCiro += tutar;
                    }
                });
            }

            const ePay = eCiro * 0.50; // Ercan %50 Pay
            const fPay = fCiro * 0.30; // Efe %30 Pay
            const bugunToplam = nT + kT;
            const netKalan = bugunToplam - (ePay + fPay + gTop);

            // Ekrana yazdır
            document.getElementById('cToplam').innerText = bugunToplam + " ₺";
            document.getElementById('gToplam').innerText = gTop + " ₺";
            document.getElementById('nToplam').innerText = nT + "₺";
            document.getElementById('kToplam').innerText = kT + "₺";
            document.getElementById('cErcan').innerText = "Bugün Ciro: " + eCiro + "₺";
            document.getElementById('pErcan').innerText = Math.floor(ePay) + " ₺";
            document.getElementById('cEfe').innerText = "Bugün Ciro: " + fCiro + "₺";
            document.getElementById('pEfe').innerText = Math.floor(fPay) + " ₺";
            document.getElementById('netKalan').innerText = Math.floor(netKalan) + " ₺";
        });

        // AYLIK CİROYU AYRI DİNLE (Günü kapatınca silinmez)
        const simdi = new Date();
        const ayID = simdi.getFullYear() + "-" + (simdi.getMonth() + 1);
        db.ref('aylik/' + ayID).on('value', (snapshot) => {
            const aylik = snapshot.val() || 0;
            document.getElementById('aylikCiro').innerText = aylik.toLocaleString('tr-TR') + " ₺";
        });

        function kasaSifirla() {
            if(confirm("Ahmet abi, bugünkü tüm işlemleri silmek ve günü kapatmak istediğine emin misin? (Aylık ciro silinmez)")) {
                db.ref('kasa/').remove();
            }
        }
    </script>
</body>
</html>
