<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Berber Pro Kasa</title>
<style>
:root{
  --bg:#0b0b0c;
  --card:#151518;
  --accent:#d4af37;
  --text:#f5f5f7;
  --muted:#9b9ba1;
  --danger:#ff4d4f;
}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto}
body{margin:0;background:var(--bg);color:var(--text);}
h2{margin:0 0 10px;font-size:18px;color:var(--accent)}
.dashboard{
  display:flex;gap:14px;overflow-x:auto;padding:16px;
}
.card{
  min-width:300px;background:var(--card);
  border-radius:16px;padding:16px;
  box-shadow:0 0 0 1px rgba(255,255,255,0.03);
}
.stat{font-size:22px;font-weight:600;margin:6px 0}
.muted{color:var(--muted);font-size:13px}
.btn{
  background:var(--accent);color:#000;border:none;
  padding:12px;border-radius:12px;margin:6px 0;
  width:100%;font-weight:600;
}
.btn2{
  background:#222;border:1px solid #333;color:var(--text);
}
.input, select{
  width:100%;padding:10px;margin:6px 0;border-radius:10px;
  border:1px solid #2a2a2e;background:#0e0e11;color:#fff;
}
.row{display:flex;gap:8px}
.small{font-size:12px;color:var(--muted)}
.employee{
  display:flex;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid #222;
}
.del{color:var(--danger);cursor:pointer}
</style>
</head>
<body>

<div class="dashboard">

  <!-- KASA ÖZET -->
  <div class="card">
    <h2>💼 Kasa Özeti</h2>
    <div class="small">Bugün Ciro</div>
    <div id="total" class="stat">0 ₺</div>
    <div class="small">Nakit</div>
    <div id="cash" class="stat">0 ₺</div>
    <div class="small">Kart</div>
    <div id="card" class="stat">0 ₺</div>
    <div class="small">KDV</div>
    <div id="vat" class="stat">0 ₺</div>
    <div class="small">Net Kazanç</div>
    <div id="net" class="stat">0 ₺</div>
  </div>

  <!-- HIZLI İŞLEM -->
  <div class="card">
    <h2>💈 Hızlı İşlem</h2>
    <div id="services"></div>
    <select id="employeeSelect"></select>
    <select id="payType" class="input">
      <option value="cash">Nakit</option>
      <option value="card">Kart</option>
    </select>
  </div>

  <!-- ELEMAN PANEL -->
  <div class="card">
    <h2>👨‍🔧 Elemanlar</h2>
    <div id="employeeList"></div>
    <input id="newEmp" class="input" placeholder="Yeni eleman adı"/>
    <button class="btn" onclick="addEmployee()">Eleman Ekle</button>
  </div>

  <!-- AYARLAR -->
  <div class="card">
    <h2>⚙️ Ayarlar</h2>
    <label class="small">KDV (%)</label>
    <input id="vatRate" type="number" class="input" />
    <label class="small">Komisyon (%)</label>
    <input id="comRate" type="number" class="input" />
    <h3 class="small">Hizmetler</h3>
    <div id="serviceList"></div>
    <input id="srvName" class="input" placeholder="Hizmet adı"/>
    <input id="srvPrice" type="number" class="input" placeholder="Fiyat"/>
    <button class="btn" onclick="addService()">Hizmet Ekle</button>
  </div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("kasaData")) || {
  vat:20, com:50,
  services:[
    {name:"Saç",price:500},
    {name:"Saç + Sakal",price:700},
    {name:"Sakal",price:250}
  ],
  employees:["Ali","Mehmet"],
  logs:[]
};

function save(){localStorage.setItem("kasaData",JSON.stringify(data));render();}

function addLog(price,emp,type){
  data.logs.push({price,emp,type,date:new Date().toDateString()});
  save();
}

function calc(){
  let today = new Date().toDateString();
  let logs=data.logs.filter(l=>l.date===today);
  let total=logs.reduce((a,b)=>a+b.price,0);
  let cash=logs.filter(l=>l.type==="cash").reduce((a,b)=>a+b.price,0);
  let card=logs.filter(l=>l.type==="card").reduce((a,b)=>a+b.price,0);
  let vat=total*data.vat/100;
  let net=total-vat;
  return{total,cash,card,vat,net};
}

function render(){
  let c=calc();
  total.textContent=c.total+" ₺";
  cash.textContent=c.cash+" ₺";
  card.textContent=c.card+" ₺";
  vat.textContent=c.vat.toFixed(0)+" ₺";
  net.textContent=c.net.toFixed(0)+" ₺";

  // services buttons
  services.innerHTML="";
  data.services.forEach(s=>{
    let b=document.createElement("button");
    b.className="btn";
    b.textContent=s.name+" - "+s.price+"₺";
    b.onclick=()=>addLog(s.price,employeeSelect.value,payType.value);
    services.appendChild(b);
  });

  // employee select & list
  employeeSelect.innerHTML="";
  employeeList.innerHTML="";
  data.employees.forEach((e,i)=>{
    let opt=document.createElement("option");
    opt.value=e;opt.textContent=e;
    employeeSelect.appendChild(opt);

    let div=document.createElement("div");
    div.className="employee";
    div.innerHTML=`${e} <span class="del" onclick="delEmp(${i})">❌</span>`;
    employeeList.appendChild(div);
  });

  // settings
  vatRate.value=data.vat;
  comRate.value=data.com;

  // service list
  serviceList.innerHTML="";
  data.services.forEach((s,i)=>{
    serviceList.innerHTML+=`<div class="employee">${s.name} - ${s.price}₺ <span class="del" onclick="delService(${i})">❌</span></div>`;
  });
}

function addEmployee(){
  let n=newEmp.value.trim();
  if(n){data.employees.push(n);newEmp.value="";save();}
}
function delEmp(i){data.employees.splice(i,1);save();}

function addService(){
  let n=srvName.value.trim();
  let p=parseInt(srvPrice.value);
  if(n&&p){data.services.push({name:n,price:p});srvName.value="";srvPrice.value="";save();}
}
function delService(i){data.services.splice(i,1);save();}

vatRate.onchange=()=>{data.vat=parseInt(vatRate.value)||0;save();}
comRate.onchange=()=>{data.com=parseInt(comRate.value)||0;save();}

render();
</script>
</body>
</html>
